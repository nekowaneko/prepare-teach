<title>口袋裡的物理實驗室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* ===== 暖石板琥珀 tokens.css（原樣內嵌，請勿手動修改） ===== */
:root, [data-theme="light"] {
  --surface-page: #F4F1EC;
  --surface-card: #FFFFFF;
  --surface-slate: #3A4250;
  --ink: #2B313C;
  --ink-muted: #636B78;
  --on-slate: #E8E2D6;
  --amber: #E9A23B;
  --on-amber: #3A2A0C;
  --amber-text: #8A5A12;
  --amber-soft: #F7E6C4;
  --amber-on-slate: #F2B544;
  --progress-fill: #B07014;
  --progress-track: #ECE7DE;
  --line: #E2DCD1;
  --success: #2A7050;
  --success-soft: #DCEFE4;
  --danger: #B23B2E;
  --danger-soft: #F8DEDA;
  --focus: #B07014;
}

[data-theme="dark"] {
  --surface-page: #1E2229;
  --surface-card: #272C35;
  --surface-slate: #4A5363;
  --ink: #EEEAE3;
  --ink-muted: #A3ABB8;
  --on-slate: #E8E2D6;
  --amber: #F2B544;
  --on-amber: #3A2A0C;
  --amber-text: #F2B544;
  --amber-soft: #4A3A1E;
  --amber-on-slate: #F2B544;
  --progress-fill: #F2B544;
  --progress-track: #343A45;
  --line: #3A404B;
  --success: #6CC59A;
  --success-soft: #1F3A2D;
  --danger: #F08A7E;
  --danger-soft: #45231F;
  --focus: #F2B544;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --surface-page: #1E2229;
    --surface-card: #272C35;
    --surface-slate: #4A5363;
    --ink: #EEEAE3;
    --ink-muted: #A3ABB8;
    --on-slate: #E8E2D6;
    --amber: #F2B544;
    --on-amber: #3A2A0C;
    --amber-text: #F2B544;
    --amber-soft: #4A3A1E;
    --amber-on-slate: #F2B544;
    --progress-fill: #F2B544;
    --progress-track: #343A45;
    --line: #3A404B;
    --success: #6CC59A;
    --success-soft: #1F3A2D;
    --danger: #F08A7E;
    --danger-soft: #45231F;
    --focus: #F2B544;
  }
}

:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --radius-bar: 2px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 999px;
  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}

.sl-text-display { font-family: var(--font-sans); font-size: 28px; line-height: 36px; font-weight: 500; }
.sl-text-title { font-family: var(--font-sans); font-size: 20px; line-height: 28px; font-weight: 500; }
.sl-text-stat { font-family: var(--font-sans); font-size: 24px; line-height: 30px; font-weight: 500; }
.sl-text-body { font-family: var(--font-sans); font-size: 15px; line-height: 24px; font-weight: 400; }
.sl-text-label { font-family: var(--font-sans); font-size: 13px; line-height: 20px; font-weight: 500; }
.sl-text-caption { font-family: var(--font-sans); font-size: 12px; line-height: 18px; font-weight: 400; }

/* ===== 暖石板琥珀 components.css（原樣內嵌，請勿手動修改） ===== */
body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--ink); font-size: 15px; line-height: 24px; }
.sl-row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; padding: var(--space-4); }
.sl-btn { font: inherit; font-size: 13px; font-weight: 500; height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-card); color: var(--ink); cursor: pointer; }
.sl-btn:hover { border-color: var(--ink-muted); }
.sl-btn-primary { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.sl-btn-primary:hover { border-color: var(--on-amber); }
.sl-btn-slate { background: var(--surface-slate); border-color: var(--surface-slate); color: var(--on-slate); }
.sl-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sl-badge { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 var(--space-2); border-radius: var(--radius-pill); background: var(--line); color: var(--ink); }
.sl-badge-amber { background: var(--amber-soft); color: var(--amber-text); }
.sl-badge-success { background: var(--success-soft); color: var(--success); }
.sl-badge-danger { background: var(--danger-soft); color: var(--danger); }
.sl-bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
.sl-card { background: var(--surface-card); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); }
.sl-card-label { font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.sl-card-value { font-size: 24px; line-height: 30px; font-weight: 500; color: var(--ink); }
.sl-card-slate { background: var(--surface-slate); }
.sl-card-slate .sl-card-label { color: var(--on-slate); }
.sl-card-slate .sl-card-value { color: var(--amber-on-slate); }
.sl-progress-head { display: flex; justify-content: space-between; font-size: 12px; line-height: 18px; color: var(--ink-muted); margin-bottom: 6px; }
.sl-progress-num { color: var(--ink); font-weight: 500; }
.sl-progress-track { height: 4px; border-radius: var(--radius-bar); background: var(--progress-track); overflow: hidden; }
.sl-progress-fill { height: 100%; border-radius: var(--radius-bar); background: var(--progress-fill); }

/* ===== 版面（只用 token，不寫死色碼） ===== */
/* 版面概念：上方一條原型說明，下方依畫面切換：導覽頁卡片牆／單元頁三欄示意／學生手機單欄 */
* { box-sizing: border-box; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: var(--space-4) var(--space-8); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: var(--space-4); }
.sl-row { padding: 0; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
.muted { color: var(--ink-muted); }
.stack { display: grid; gap: var(--space-2); min-width: 0; }
.stack-lg { display: grid; gap: var(--space-4); min-width: 0; }
.spread { display: flex; gap: var(--space-3); align-items: center; justify-content: space-between; flex-wrap: wrap; }
.sl-badge { justify-self: start; }
.proto { border: 1px dashed var(--ink-muted); }
.proto .sl-progress-num { white-space: nowrap; }
.proto .sl-progress-track { margin-top: var(--space-1); }
.field-label { color: var(--ink-muted); min-width: 6em; }
.url { font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 18px; overflow-wrap: anywhere; color: var(--ink-muted); }
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--space-2); }
.card-btn { font: inherit; color: inherit; text-align: left; width: 100%; border: 1px solid transparent; cursor: pointer; display: grid; gap: var(--space-1); align-content: start; }
.card-btn:hover { border-color: var(--line); }
.card-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.card-title { font-weight: 500; }
.notice { border: 1px solid var(--line); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; line-height: 20px; }
th, td { text-align: left; vertical-align: top; padding: var(--space-2); border-bottom: 1px solid var(--line); }
th { color: var(--ink-muted); font-weight: 500; white-space: nowrap; }
.link-btn { font: inherit; background: none; border: none; padding: 0; color: var(--amber-text); cursor: pointer; text-align: left; text-decoration: underline; }
.link-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* 單元頁示意 */
.unit-body { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 380px); gap: var(--space-3); }
.mock-box { border: 1px dashed var(--line); color: var(--ink-muted); align-content: start; }
.mock-canvas { min-height: 320px; display: grid; place-items: center; text-align: center; }
.board { font-size: 20px; line-height: 40px; font-weight: 500; }
.opts { display: inline-flex; gap: var(--space-1); align-items: center; padding: 0 var(--space-2); margin: 0 var(--space-1); border: 2px dashed var(--ink-muted); border-radius: var(--radius-pill); white-space: nowrap; }
.opt-sep { color: var(--ink-muted); font-weight: 400; }
.write-area { min-height: 120px; border: 1px dashed var(--line); border-radius: var(--radius-md); }
.qr { width: 260px; max-width: 100%; padding: var(--space-2); background: var(--on-slate); border-radius: var(--radius-md); }
.qr svg { display: block; width: 100%; height: auto; }

/* 表單欄位（單元頁沿用原作品的欄位，這裡用 token 示意） */
input[type="text"], textarea, select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-1) var(--space-2); max-width: 100%; }
input[type="text"], textarea { width: 100%; }
textarea { min-height: 64px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.step-row { border-top: 1px solid var(--line); padding-top: var(--space-2); }

/* 學生手機示意 */
.phone { width: 100%; max-width: 390px; margin: 0 auto; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-4); background: var(--surface-page); display: grid; gap: var(--space-3); }
.q { display: grid; gap: var(--space-2); }

@media (max-width: 900px) {
  .unit-body { grid-template-columns: minmax(0, 1fr); }
  .mock-canvas { min-height: 200px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ---------- 假資料 ----------
const SITE = 'https://你的帳號.github.io/prepare-teach/'
const MODES = { prep: '備課', project: '投影上課', student: '學生作答' }
// 網址只用班級代碼（數字），畫面上才顯示班名
const CLASSES = [{ code: '201', name: '忠班' }, { code: '202', name: '孝班' }, { code: '203', name: '仁班' }, { code: '204', name: '愛班' }]
const clsLabel = (code) => { const c = CLASSES.find((x) => x.code === code); return c ? `${c.code} ${c.name}` : code }
const validCls = (code) => CLASSES.some((x) => x.code === code) ? code : CLASSES[0].code

const groups = [
  { name: '高中物理', units: [
    { id: 'shm', title: '簡諧運動：等速圓周運動的投影與彈簧振子', meta: '高二選修物理．PEb-Va-4、PEb-Va-9', status: 'ready' },
    { id: 'tir', title: '全反射的應用', meta: '高中物理．PKa-Va-11', status: 'plan' }
  ] },
  { name: '國中理化', units: [] },
  { name: '國中地科', units: [
    { id: 'es-index', title: '國中地科教學模擬索引', meta: '外部模擬的整理清單', status: 'external' }
  ] }
]

// 沿用簡諧運動 v5 的預設題目
const defaultSteps = [
  { id: 's1', kind: 'text', title: 'STEP 1 觀察', prompt: '先觀察上方圓周運動產生的「灰色影子」，以及下方「綠色彈簧球」的運動。它們現在的快慢一樣嗎？', board: '灰色影子的速度 {＞|＝|＜} 綠色彈簧球的速度' },
  { id: 's2', kind: 'cloze', title: 'STEP 2 預測', prompt: '先預測，再動手驗證。', blanks: [{ text: '如果把彈簧球的質量 m 變為原本的 4 倍，振盪會', options: ['變快', '變慢', '不變'], answer: '變慢' }], board: 'm 變 4 倍，振盪 {變快|變慢*|不變}' },
  { id: 's3', kind: 'task', title: 'STEP 3 動手對齊', prompt: '調整彈簧常數 k 與質量 m，讓彈簧球與灰色影子完全重合。成功一次後，換一組再對齊一次。', need: 2, board: '讓彈簧球對齊影子' },
  { id: 's4', kind: 'cloze', title: 'STEP 4 觀察向量', prompt: '在同步狀態下按暫停，拖曳時間軸觀察彈簧球的向量。', blanks: [{ text: '位移 x 在端點最大時，速度 v 為', options: ['0（靜止）', '最大值'], answer: '0（靜止）' }, { text: '加速度 a 的方向永遠', options: ['指向平衡點', '遠離平衡點'], answer: '指向平衡點' }], board: '端點的速度 v {＝ 0*|最大}\n加速度 a 的方向 {指向*|遠離} 平衡點' },
  { id: 's5', kind: 'cloze', title: 'STEP 5 發現規律', prompt: '比較你成功對齊時的 k、m 與 ω。', blanks: [{ text: '投影源的角速度 ω 等於彈簧系統的', options: ['k / m', '√(k / m)', 'm / k'], answer: '√(k / m)' }], board: 'ω ＝ {k/m|√(k/m)*|m/k}' },
  { id: 's6', kind: 'text', title: '綜合心得', prompt: '寫下你在對齊過程中觀察到的現象，或對公式的理解。', board: '我的發現：' }
]

const curriculum = [
  { code: 'PEb-Va-4', text: '簡諧運動為一週期性運動，其位移和速度可用時間的正弦函數或餘弦函數表示。', mine: 'shm', ext: ['簡諧運動彈簧振子模擬器', '參考圓簡諧運動模擬器'] },
  { code: 'PEb-Va-9', text: '牛頓第二運動定律的應用，例如：簡諧運動與等速圓周運動。', mine: 'shm', ext: ['簡諧運動彈簧振子模擬器'] },
  { code: 'PKa-Va-11', text: '光的折射遵循司乃耳定律，光由光密介質進入光疏介質的入射角大於臨界角時會發生全反射。', mine: 'tir', ext: ['全反射與光纖互動模擬器'] }
]

// ---------- 狀態 ----------
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch (e) { return d } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { /* 不保留 */ } }
}
const clone = (x) => JSON.parse(JSON.stringify(x))
const S = {
  screen: 'nav', tab: 'units',
  mode: store.get('proto.mode', 'prep'),
  cls: validCls(store.get('proto.cls', '201')),
  last: (() => { const l = store.get('proto.last', null); return l && l.cls === validCls(l.cls) ? l : null })(),
  notice: '',
  steps: clone(defaultSteps),
  editing: 1, saveMsg: '',
  qIndex: 0, shareOpen: false, loading: false,
  stu: { name: '', answers: {}, submitted: false, error: '', broken: false },
  done: { open: false, save: false, project: false, share: false, submit: false }
}

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

// 只把和預設不同的題目放進網址，網址才短、QR code 才掃得到
const changedSteps = () => S.steps.filter((s) => JSON.stringify(s) !== JSON.stringify(defaultSteps.find((d) => d.id === s.id)))
const unitUrl = (mode, cls) => `units/shm.html?mode=${mode}${mode === 'prep' ? '' : `&class=${cls}`}`
const studentUrl = () => {
  const changed = changedSteps()
  const hash = changed.length ? '#q=' + LZString.compressToEncodedURIComponent(JSON.stringify(changed)) : ''
  return `${SITE}units/shm.html?mode=student&class=${S.cls}${hash}`
}

const boardHtml = (text) => esc(text).split('\n').map((line) => `<div>${line.replace(/\{([^}]*)\}/g, (m, inner) =>
  `<span class="opts">${inner.split('|').map((o) => o.replace(/\*$/, '').trim()).join('<span class="opt-sep">／</span>')}</span>`)}</div>`).join('')

// ---------- 原型說明條（正式版沒有） ----------
const pathSteps = [
  ['open', '在導覽頁選「備課」，點簡諧運動'],
  ['save', '改一題的題目或板書，按「儲存題目」'],
  ['project', '切到「投影上課」並選班級'],
  ['share', '按「發給學生」，看學生網址與 QR code'],
  ['submit', '按「模擬學生掃描」，用手機畫面填姓名後交出']
]
const protoHtml = () => {
  const n = pathSteps.filter(([k]) => S.done[k]).length
  const next = pathSteps.find(([k]) => !S.done[k])
  const pct = Math.round(n / pathSteps.length * 100)
  return `<section class="sl-card proto stack" aria-label="原型說明">
    <div class="spread">
      <span class="sl-text-label">原型說明（正式版沒有這一條）</span>
      <div class="sl-row">
        ${S.screen === 'student' ? '<button class="sl-btn" type="button" data-act="demo-broken">示範網址不完整</button>' : ''}
        <button class="sl-btn" type="button" data-act="restart">重新開始</button>
      </div>
    </div>
    <div>
      <div class="sl-progress-head"><span>核心路徑：${next ? `下一步，${next[1]}` : '五步都走完了'}</span><span class="sl-progress-num">${n} / ${pathSteps.length}</span></div>
      <div class="sl-progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="核心路徑完成度"><div class="sl-progress-fill" style="width: ${pct}%;"></div></div>
    </div>
  </section>`
}

// ---------- 導覽頁 ----------
const modeBtns = (cur, act) => Object.entries(MODES).map(([k, v]) =>
  `<button class="sl-btn${cur === k ? ' sl-btn-slate' : ''}" type="button" data-act="${act}" data-v="${k}" aria-pressed="${cur === k}">${v}</button>`).join('')
const classBtns = () => CLASSES.map((c) =>
  `<button class="sl-btn${S.cls === c.code ? ' sl-btn-slate' : ''}" type="button" data-act="cls" data-v="${c.code}" aria-pressed="${S.cls === c.code}">${clsLabel(c.code)}</button>`).join('')

const unitCard = (u) => {
  const badge = { ready: '<span class="sl-badge sl-badge-success">三種模式都有</span>', plan: '<span class="sl-badge sl-badge-amber">只有教案</span>', external: '<span class="sl-badge">外部模擬</span>' }[u.status]
  const hint = u.status === 'ready' ? `開啟${MODES[S.mode]}` : u.status === 'external' ? '在新分頁開啟，不分模式' : '還沒有模擬頁'
  return `<button class="sl-card card-btn" type="button" data-act="unit" data-v="${u.id}">
    <span class="card-title">${esc(u.title)}</span>
    <span class="sl-card-label">${esc(u.meta)}</span>
    <span class="spread">${badge}<span class="sl-text-caption muted">${hint}</span></span>
  </button>`
}

const navHtml = () => {
  const lastCard = S.last
    ? `<button class="sl-card sl-card-slate card-btn" type="button" data-act="resume">
        <span class="sl-card-label">繼續上次</span>
        <span class="sl-card-value">簡諧運動</span>
        <span class="sl-card-label">${MODES[S.last.mode]}${S.last.mode === 'prep' ? '' : `．${clsLabel(S.last.cls)}`}</span>
      </button>`
    : `<div class="sl-card stack"><span class="sl-card-label">繼續上次</span><span class="muted">還沒有開過單元。選好模式後點下方的單元卡片。</span></div>`
  const units = groups.map((g) => `<section class="stack" aria-label="${g.name}">
      <h2 class="sl-text-label muted">${g.name}</h2>
      ${g.units.length ? `<div class="unit-grid">${g.units.map(unitCard).join('')}</div>`
        : `<div class="sl-card stack"><span>還沒有自己的單元。</span><span class="muted">可以先到課綱對照找現成的外部模擬。</span><div class="sl-row"><button class="sl-btn" type="button" data-act="tab" data-v="curriculum">查課綱對照</button></div></div>`}
    </section>`).join('')
  const curr = `<section class="stack-lg" aria-label="課綱對照">
      <p class="muted">完整內容沿用現有的「線上模擬與課綱對照」頁，這裡在每個條目旁標出你自己的單元。以下為三列示意。</p>
      <div class="sl-card table-wrap"><table>
        <thead><tr><th>條目</th><th>內容</th><th>我的單元</th><th>外部模擬</th></tr></thead>
        <tbody>${curriculum.map((r) => {
          const u = groups.flatMap((g) => g.units).find((x) => x.id === r.mine)
          return `<tr><td>${r.code}</td><td>${esc(r.text)}</td>
            <td><button class="link-btn" type="button" data-act="unit" data-v="${u.id}">${esc(u.title.split('：')[0])}</button>${u.status === 'plan' ? ' <span class="sl-badge sl-badge-amber">只有教案</span>' : ''}</td>
            <td>${r.ext.map(esc).join('<br>')}</td></tr>`
        }).join('')}</tbody>
      </table></div>
    </section>`
  return `<header class="spread">
      <h1 class="sl-text-title">口袋裡的物理實驗室</h1>
      <div class="sl-row" role="group" aria-label="頁面">
        <button class="sl-btn${S.tab === 'units' ? ' sl-btn-slate' : ''}" type="button" data-act="tab" data-v="units" aria-pressed="${S.tab === 'units'}">單元</button>
        <button class="sl-btn${S.tab === 'curriculum' ? ' sl-btn-slate' : ''}" type="button" data-act="tab" data-v="curriculum" aria-pressed="${S.tab === 'curriculum'}">課綱對照</button>
      </div>
    </header>
    <section class="sl-card stack" aria-label="今天要做什麼">
      <div class="sl-row"><span class="sl-text-label field-label">今天要做什麼</span><div class="sl-row" role="group" aria-label="模式">${modeBtns(S.mode, 'mode')}</div></div>
      ${S.mode === 'prep' ? '' : `<div class="sl-row"><span class="sl-text-label field-label">班級</span><div class="sl-row" role="group" aria-label="班級">${classBtns()}</div></div>`}
      <p class="url">點單元會開啟：${esc(unitUrl(S.mode, S.cls))}</p>
    </section>
    ${S.notice ? `<div class="sl-card notice spread" role="status"><span>${S.notice}</span><button class="sl-btn" type="button" data-act="close-notice">知道了</button></div>` : ''}
    ${S.tab === 'units' ? `<div class="unit-grid">${lastCard}</div>${units}` : curr}`
}

// ---------- 單元頁（示意：實際畫面沿用原作品） ----------
const prepSide = () => `<h2 class="sl-text-label">修改學習單題目</h2>
  <p class="sl-text-caption muted">教案表照現在的 v5，這裡略過，只示意題目。</p>
  ${S.steps.map((s, i) => i === S.editing ? `<div class="step-row stack">
      <strong>${esc(s.title)}</strong>
      <label class="sl-text-caption muted" for="ed-prompt">說明文字</label>
      <textarea id="ed-prompt">${esc(s.prompt)}</textarea>
      <label class="sl-text-caption muted" for="ed-board">投影板書（選項用 { } 包起來，正確答案後面加 *）</label>
      <textarea id="ed-board">${esc(s.board)}</textarea>
      <div class="sl-row"><button class="sl-btn sl-btn-primary" type="button" data-act="save">儲存題目</button><button class="sl-btn" type="button" data-act="reset-steps">還原預設題</button></div>
      ${S.saveMsg ? `<p class="sl-badge sl-badge-success" role="status">${S.saveMsg}</p>` : ''}
    </div>` : `<div class="step-row spread"><span>${esc(s.title)}</span><button class="sl-btn" type="button" data-act="edit" data-v="${i}">修改</button></div>`).join('')}`

const projectSide = () => {
  const s = S.steps[S.qIndex]
  const share = S.shareOpen ? (() => {
    const url = studentUrl()
    const qr = qrcode(0, 'L'); qr.addData(url); qr.make()
    const n = changedSteps().length
    return `<section class="sl-card stack notice" aria-label="發給學生">
      <div class="spread"><strong>請學生用手機掃描</strong><span class="sl-badge">${clsLabel(S.cls)}</span></div>
      <div class="qr" role="img" aria-label="學生網址的 QR code">${qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}</div>
      <p class="url">${esc(url)}</p>
      <p class="sl-text-caption muted">網址長度 ${url.length} 字元。${n ? `你改過的 ${n} 題已放進網址，其餘用預設題。` : '沒有改過題目，學生看到的是預設題。'}學生不用登入。</p>
      <div class="sl-row"><button class="sl-btn" type="button" data-act="copy-url">複製網址</button><button class="sl-btn" type="button" data-act="scan">模擬學生掃描</button><button class="sl-btn" type="button" data-act="close-share">收起</button></div>
      <p class="sl-text-caption muted" id="copyMsg" role="status"></p>
    </section>`
  })() : ''
  return `<div class="spread">
      <span class="sl-badge">${esc(s.title)}　${S.qIndex + 1} / ${S.steps.length}</span>
      <div class="sl-row"><button class="sl-btn" type="button" data-act="q-prev" ${S.qIndex === 0 ? 'disabled' : ''}>上一題</button><button class="sl-btn" type="button" data-act="q-next" ${S.qIndex === S.steps.length - 1 ? 'disabled' : ''}>下一題</button></div>
    </div>
    <div class="board">${boardHtml(s.board)}</div>
    ${S.shareOpen ? share : '<div class="sl-row"><button class="sl-btn sl-btn-primary" type="button" data-act="share">發給學生</button></div>'}
    <div class="write-area" aria-label="老師書寫區"></div>`
}

const unitHtml = () => `<header class="spread">
    <div class="sl-row"><button class="sl-btn" type="button" data-act="home">回導覽</button><h1 class="sl-text-label">簡諧運動：等速圓周運動的投影與彈簧振子</h1></div>
    <div class="sl-row" role="group" aria-label="模式">${modeBtns(S.mode, 'unit-mode')}${S.mode === 'prep' ? '' : `<span class="sl-badge">${clsLabel(S.cls)}</span>`}</div>
  </header>
  <p class="url">網址：${esc(unitUrl(S.mode, S.cls))}</p>
  <p class="sl-text-caption muted">示意：實際畫面沿用簡諧運動原作品的外觀與配色，這裡只畫出這次新增或改動的部分（回導覽、班級、發給學生）。</p>
  <div class="unit-body">
    <aside class="sl-card mock-box stack" aria-label="實驗控制板"><span class="sl-text-label">實驗控制板</span><span class="sl-text-caption">沿用原作品：時間軸、ω、R、k、m 滑桿、向量開關、同步判定</span></aside>
    <main class="sl-card mock-box mock-canvas" aria-label="模擬畫面">${S.loading ? '動畫載入中…' : '模擬畫面（沿用原作品）'}</main>
    <section class="sl-card stack-lg" aria-label="側欄">${S.mode === 'prep' ? prepSide() : S.mode === 'project' ? projectSide() : `<p class="muted">學生作答模式在教室電腦上的樣子和 v5 相同，資料存在 ${clsLabel(S.cls)} 的紀錄裡。學生用手機作答請從「投影上課」按「發給學生」。</p>`}</section>
  </div>`

// ---------- 學生手機 ----------
const stuDone = (s) => s.kind === 'task' ? false : s.kind === 'text' ? !!(S.stu.answers[s.id] || '').trim() : s.blanks.every((b, bi) => !!S.stu.answers[`${s.id}-${bi}`])
const studentSteps = () => S.stu.broken ? clone(defaultSteps) : S.steps

const studentHtml = () => {
  const steps = studentSteps()
  const changed = changedSteps().length
  const head = `<div class="spread"><button class="sl-btn" type="button" data-act="back-teacher">回老師畫面</button><span class="sl-text-caption muted">學生手機畫面示意．${clsLabel(S.cls)}</span></div>`
  if (S.stu.submitted) {
    const cloze = steps.filter((s) => s.kind === 'cloze').flatMap((s) => s.blanks.map((b, bi) => ({ b, a: S.stu.answers[`${s.id}-${bi}`] })))
    const right = cloze.filter((x) => x.a === x.b.answer).length
    return `<div class="phone">${head}
      <h1 class="sl-text-title">作答摘要</h1>
      <span class="sl-badge sl-badge-success">已交出：${esc(S.stu.name)}</span>
      <p>選填題答對 ${right} / ${cloze.length}。</p>
      ${cloze.map((x) => `<div class="sl-card stack"><span>${esc(x.b.text)}</span><span class="spread"><strong>${esc(x.a || '（未作答）')}</strong><span class="sl-badge ${x.a === x.b.answer ? 'sl-badge-success' : 'sl-badge-danger'}">${x.a === x.b.answer ? '正確' : '再想想'}</span></span></div>`).join('')}
      <div class="sl-row"><button class="sl-btn sl-btn-primary" type="button" data-act="copy-summary">複製摘要</button><button class="sl-btn" type="button" data-act="back-edit">回到作答</button></div>
      <p class="sl-text-caption muted" id="sumMsg" role="status">複製後貼到 Classroom 或傳給老師。</p>
    </div>`
  }
  const done = steps.filter(stuDone).length
  const pct = Math.round(done / steps.length * 100)
  return `<div class="phone">${head}
    <h1 class="sl-text-title">簡諧運動學習單</h1>
    ${S.stu.broken
      ? '<div class="sl-card stack" role="alert"><span class="sl-badge sl-badge-danger">題目沒有載入</span><span>這個網址的題目資料不完整，先用預設題目作答。請向老師要新的網址。</span></div>'
      : changed ? `<span class="sl-badge sl-badge-success">已載入老師更新的 ${changed} 題</span>` : ''}
    <div class="q"><label class="sl-text-label" for="stuName">座號與姓名</label><input type="text" id="stuName" placeholder="例如：12 王小明" value="${esc(S.stu.name)}"></div>
    <div><div class="sl-progress-head"><span>完成進度</span><span class="sl-progress-num">${done} / ${steps.length}</span></div>
      <div class="sl-progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="完成進度"><div class="sl-progress-fill" style="width: ${pct}%;"></div></div></div>
    ${steps.map((s) => `<div class="sl-card q"><strong>${esc(s.title)}</strong><span>${esc(s.prompt)}</span>${
      s.kind === 'text' ? `<textarea data-ans="${s.id}" aria-label="${esc(s.title)}">${esc(S.stu.answers[s.id] || '')}</textarea>`
      : s.kind === 'cloze' ? s.blanks.map((b, bi) => `<label class="stack">${esc(b.text)}<select data-ans="${s.id}-${bi}"><option value="">請選擇</option>${b.options.map((o) => `<option ${S.stu.answers[`${s.id}-${bi}`] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`).join('')
      : '<span class="sl-badge">進行中：已對齊 0 / 2 組</span><span class="sl-text-caption muted">手機上一樣有模擬可以操作，這裡略過。</span>'
    }</div>`).join('')}
    ${S.stu.error ? `<div class="sl-badge sl-badge-danger" role="alert">${S.stu.error}</div>` : ''}
    <button class="sl-btn sl-btn-primary" type="button" data-act="submit">交出學習單</button>
  </div>`
}

// ---------- 繪製與事件 ----------
const render = () => {
  $('app').innerHTML = protoHtml() + ({ nav: navHtml, unit: unitHtml, student: studentHtml })[S.screen]()
}

const openUnit = () => {
  S.screen = 'unit'; S.shareOpen = false; S.loading = true
  S.last = { mode: S.mode, cls: S.cls }; store.set('proto.last', S.last)
  if (S.mode === 'prep') S.done.open = true
  if (S.mode === 'project') S.done.project = true
  render()
  setTimeout(() => { S.loading = false; if (S.screen === 'unit') render() }, 700)
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]')
  if (!t) return
  const v = t.dataset.v
  switch (t.dataset.act) {
    case 'restart':
      Object.assign(S, { screen: 'nav', tab: 'units', mode: 'prep', notice: '', steps: clone(defaultSteps), editing: 1, saveMsg: '', qIndex: 0, shareOpen: false, last: null,
        stu: { name: '', answers: {}, submitted: false, error: '', broken: false }, done: { open: false, save: false, project: false, share: false, submit: false } })
      store.set('proto.last', null); store.set('proto.mode', 'prep'); break
    case 'tab': S.tab = v; S.notice = ''; break
    case 'mode': S.mode = v; store.set('proto.mode', v); break
    case 'cls': S.cls = v; store.set('proto.cls', v); break
    case 'close-notice': S.notice = ''; break
    case 'unit':
      if (v === 'shm') return openUnit()
      S.notice = v === 'tir' ? '「全反射的應用」還沒有模擬頁，目前只有教案（全反射的應用_教案.docx）。'
        : '正式版會在新分頁開啟「國中地科教學模擬索引」。'
      break
    case 'resume': S.mode = S.last.mode; S.cls = S.last.cls; return openUnit()
    case 'home': S.screen = 'nav'; break
    case 'unit-mode':
      S.mode = v; store.set('proto.mode', v); S.shareOpen = false
      if (v === 'project') S.done.project = true
      S.last = { mode: S.mode, cls: S.cls }; store.set('proto.last', S.last); break
    case 'edit': S.editing = +v; S.saveMsg = ''; break
    case 'save': {
      const s = S.steps[S.editing]
      s.prompt = $('ed-prompt').value.trim(); s.board = $('ed-board').value.trim()
      S.saveMsg = '題目已儲存，投影和學生網址都會用新題目'; S.done.save = true; break
    }
    case 'reset-steps': S.steps = clone(defaultSteps); S.saveMsg = '已還原預設題'; break
    case 'q-prev': S.qIndex = Math.max(0, S.qIndex - 1); break
    case 'q-next': S.qIndex = Math.min(S.steps.length - 1, S.qIndex + 1); break
    case 'share': S.shareOpen = true; S.done.share = true; break
    case 'close-share': S.shareOpen = false; break
    case 'copy-url': {
      const msg = $('copyMsg')
      const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(studentUrl()) : Promise.reject(new Error('no clipboard'))
      p.then(() => { msg.textContent = '已複製網址' }).catch(() => { msg.textContent = '無法自動複製，請選取上方網址後按 Ctrl＋C' })
      return
    }
    case 'scan': S.screen = 'student'; S.stu = { name: '', answers: {}, submitted: false, error: '', broken: false }; break
    case 'demo-broken': S.stu.broken = !S.stu.broken; break
    case 'back-teacher': S.screen = 'unit'; break
    case 'submit':
      if (!S.stu.name.trim()) { S.stu.error = '請先填寫座號與姓名，再交出學習單。'; render(); $('stuName').focus(); return }
      S.stu.error = ''; S.stu.submitted = true; S.done.submit = true; break
    case 'back-edit': S.stu.submitted = false; break
    case 'copy-summary': {
      const text = `簡諧運動學習單｜${S.stu.name}\n` + studentSteps().filter((s) => s.kind === 'cloze').flatMap((s) => s.blanks.map((b, bi) => `${b.text} ${S.stu.answers[`${s.id}-${bi}`] || '（未作答）'}`)).join('\n')
      const msg = $('sumMsg')
      const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard'))
      p.then(() => { msg.textContent = '已複製摘要' }).catch(() => { msg.textContent = '無法自動複製，請改用螢幕截圖交給老師' })
      return
    }
  }
  render()
})

document.addEventListener('input', (e) => {
  const el = e.target
  if (el.id === 'stuName') { S.stu.name = el.value; return }
  if (el.dataset.ans) S.stu.answers[el.dataset.ans] = el.value
})
document.addEventListener('change', (e) => { if (e.target.dataset.ans) render() })

render()
</script>
