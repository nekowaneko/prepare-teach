  { id:'greenhouse', t:'溫室效應', cat:'全球變遷', url:phet('greenhouse-effect'), q:'PhET（中文）．調整溫室氣體濃度，看地表溫度變化。', main:[], ext:['Nb-IV-2'], note:'課綱以 Nb 主題處理溫室效應與暖化，模擬只呈現機制。' + unverified },
  { id:'molecules', t:'分子與光', cat:'全球變遷', url:phet('molecules-and-light'), q:'PhET（中文）．用紅外線照射 CO₂、H₂O，說明哪些氣體是溫室氣體。', main:[], ext:['Nb-IV-2'], note:unverified }
]

// 康軒版國中自然（地科）章節與課綱學習內容對應
// 來源：富禮國中 114 學年九年級課程計畫（版本欄填康軒）；節名與竹光國中 115 學年（勾選康軒）一致
// 只收地科的學習內容代碼；學習表現與跨科代碼不列入
const tbSources = [
  { name:'新竹市富禮國中 114 學年 九年級自然課程計畫', url:'https://www.fljh.hc.edu.tw/uploads/1754456224109IJ3Glu1o.pdf' },
  { name:'新竹市竹光國中 115 學年 九年級自然課程計畫', url:'https://www.zgjh.hc.edu.tw/uploads/1785377623562g3YEkKSC.pdf' }
]
const textbook = [
  { id:'9a5', book:'九上（第五冊）', ch:'第 5 章', subj:'地科', secs:'5-1 地球上的水；5-2 地貌的改變與平衡；5-3 地球上的岩石', codes:['Fa-IV-1','Fa-IV-2','Ia-IV-1'] },
  { id:'9a6', book:'九上（第五冊）', ch:'第 6 章', subj:'地科', secs:'6-1 地球構造與板塊運動；6-2 岩層記錄的地球歷史；6-3 臺灣的板塊和地震', codes:['Ia-IV-1','Ia-IV-2','Ia-IV-3','Ia-IV-4','Hb-IV-1','Hb-IV-2','Md-IV-4'] },
  { id:'9a7', book:'九上（第五冊）', ch:'第 7 章', subj:'地科', secs:'7-1 我們的宇宙；7-2 轉動的地球；7-3 日地月相對運動', codes:['Ed-IV-1','Ed-IV-2','Fb-IV-1','Fb-IV-2','Id-IV-1','Id-IV-3','Fb-IV-3','Fb-IV-4','Ic-IV-4'] },
  { id:'9b3', book:'九下（第六冊）', ch:'第 3 章', subj:'地科', secs:'3-1 大氣的組成和結構；3-2 天氣變化；3-3 氣團和鋒面；3-4 臺灣的氣象災害', codes:['Fa-IV-1','Fa-IV-3','Fa-IV-4','Ib-IV-1','Ib-IV-2','Ib-IV-3','Ib-IV-4','Ib-IV-5','Ib-IV-6','Md-IV-2','Md-IV-3','Md-IV-5'] },
  { id:'9b4', book:'九下（第六冊）', ch:'第 4 章', subj:'地科', secs:'4-1 海洋與大氣的交互作用；4-2 溫室效應與全球暖化', codes:['Ic-IV-1','Ic-IV-2','Ic-IV-3','Nb-IV-1','Nb-IV-2','Nb-IV-3'] }
]
const textbookOf = (code) => textbook.filter(h => h.codes.includes(code))


// 畫面狀態：view 為 code（依條目）或 sim（依模擬）
const state = { stage:'J', view:'hanlin', theme:'all', cover:'all', open:{} }

// 條目 → 對應模擬（分主要與延伸）
const simsFor = (code) => ({
  main: sims.filter(s => s.main.includes(code)),
  ext: sims.filter(s => s.ext.includes(code))
})
const isCovered = (code) => { const r = simsFor(code); return r.main.length + r.ext.length > 0 }
const codesOfStage = (st) => allCodes.filter(c => stageOf(c) === st)
const themesOfStage = (st) => [...new Set(codesOfStage(st).map(themeOf))]

// 便當格：目前階段的覆蓋情形
// 我的單元：從 data/units.js 讀；連結用導覽頁上次選的模式與班級，點了和在導覽頁點卡片相同
const UNIT_PREFIX = '../'
const escHtml = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const myUnits = (code) => (window.UNITS || []).filter(u => u.status !== 'external' && u.codes.includes(code))
const hasMine = (code) => myUnits(code).length > 0
const mineLine = (code) => mineList(myUnits(code))
const mineList = (us) => {
  if (!us.length) return ''
  const p = Site.prefs()
  const item = (u) => u.status === 'ready'
    ? `<a href="${escHtml(Site.unitUrl(u, p.mode, p.cls, UNIT_PREFIX))}" data-unit="${escHtml(u.id)}" style="color: var(--amber-text);">${escHtml(u.title)}</a>`
    : `${escHtml(u.title)} <span class="sl-badge sl-badge-amber">只有教案</span>`
  return `<div class="sl-text-body">我的單元：${us.map(item).join('、')}</div>`
}

// 我的單元也算模擬：三種模式都有的單元當成「主要對應」放在清單最前面，統計、依模擬、依康軒章節都會算到
;(window.UNITS || []).filter(u => u.status === 'ready').reverse().forEach(u => {
  const p = Site.prefs()
  sims.unshift({ id: 'mine-' + u.id, t: escHtml(u.title), cat: '我的單元', url: escHtml(Site.unitUrl(u, p.mode, p.cls, UNIT_PREFIX)), q: escHtml(u.meta), main: u.codes.slice(), ext: [], mine: u.id })
})
// 我的單元連結在同一分頁開啟（寫入「繼續上次」）；外部模擬另開分頁
const simLinkAttrs = (s) => s.mine ? `data-unit="${s.mine}"` : 'target="_blank" rel="noopener"'

const renderSummary = () => {
  const codes = codesOfStage(state.stage)
  const main = codes.filter(c => simsFor(c).main.length).length
  const any = codes.filter(isCovered).length
  const pct = Math.round(any / codes.length * 100)
  const stage = stages.find(s => s.id === state.stage)
  document.getElementById('summary').innerHTML = `
    <div class="sl-bento">
      <div class="sl-card" style="grid-column: span 2;">
        <div class="sl-card-label">${stage.name}：有模擬可用的條目比例</div>
        <div class="sl-card-value">${pct}%</div>
        <div class="sl-progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="有模擬可用的條目比例" style="margin-top: var(--space-2);">
          <div class="sl-progress-fill" style="width: ${pct}%;"></div>
        </div>
      </div>
      <div class="sl-card">
        <div class="sl-card-label">主要對應的條目</div>
        <div class="sl-card-value">${main}<span class="sl-text-caption" style="color: var(--ink-muted);"> / ${codes.length} 條</span></div>
      </div>
      <div class="sl-card sl-card-slate">
        <div class="sl-card-label">還沒有模擬的條目</div>
        <div class="sl-card-value">${codes.length - any}<span class="sl-text-caption" style="color: var(--on-slate);"> 條</span></div>
      </div>
    </div>
    <p class="sl-text-body" style="margin: var(--space-2) 0 0;">${codes.filter(hasMine).length ? `我的單元涵蓋 ${codes.filter(hasMine).length} 條學習內容` : '這個學習階段還沒有自己的單元'}</p>`
}

// 篩選列：選取中的按鈕用石板色
const btn = (label, active, attrs) => `<button class="sl-btn ${active ? 'sl-btn-slate' : ''}" type="button" aria-pressed="${active}" ${attrs}>${label}</button>`
const row = (label, html) => `<div class="sl-row" style="padding: 0;"><span class="sl-text-label" style="color: var(--ink-muted); min-width: 3em;">${label}</span>${html}</div>`

const renderFilters = () => {
  const stageBtns = stages.map(s => btn(`${s.name}`, state.stage === s.id, `data-stage="${s.id}"`)).join('')
  const viewBtns = btn('依條目', state.view === 'code', 'data-view="code"') + btn('依模擬', state.view === 'sim', 'data-view="sim"') + btn('依康軒章節', state.view === 'hanlin', 'data-view="hanlin"')
  // 依模擬時每張卡片已列出三個階段，所以不顯示階段篩選
  let html = row('檢視', viewBtns) + (state.view !== 'sim' && stages.length > 1 ? row('階段', stageBtns) : '')
  if (state.view === 'code') {
    const themeBtns = [btn('全部主題', state.theme === 'all', 'data-theme-f="all"')]
      .concat(themesOfStage(state.stage).map(t => {
        const miss = codesOfStage(state.stage).filter(c => themeOf(c) === t && !isCovered(c)).length
        return btn(`${themeName[t]}（缺 ${miss}）`, state.theme === t, `data-theme-f="${t}"`)
      })).join('')
    const coverBtns = btn('全部條目', state.cover === 'all', 'data-cover="all"') + btn('只看沒有模擬', state.cover === 'missing', 'data-cover="missing"') + btn('只看有模擬', state.cover === 'covered', 'data-cover="covered"') + btn('有我的單元', state.cover === 'mine', 'data-cover="mine"')
    html += row('主題', themeBtns) + row('覆蓋', coverBtns)
  }
  document.getElementById('filters').innerHTML = html
}

// 模擬小卡（依條目檢視時展開用）
const simMini = (s, kind) => `
  <a class="sl-card" href="${s.url}" ${simLinkAttrs(s)} style="display: grid; gap: var(--space-1); border: 1px solid var(--line); color: var(--ink); text-decoration: none; min-width: 0;">
    <span style="display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center;"><span class="sl-text-label">${s.t}</span>${kind === 'main' ? '<span class="sl-badge sl-badge-success">主要對應</span>' : '<span class="sl-badge sl-badge-amber">延伸可用</span>'}</span>
    <span class="sl-text-caption" style="color: var(--ink-muted);">${s.cat}．${s.q}</span>
  </a>`

// 國中條目在康軒版的章節位置
const hanlinLine = (code) => {
  const hs = textbookOf(code)
  if (!hs.length) return ''
  return `<div class="sl-text-caption" style="color: var(--ink-muted);">康軒：${hs.map(h => `${h.book.slice(0, 2)} ${h.ch}`).join('、')}</div>`
}

// 單一條目列
const codeRow = (code) => {
  const r = simsFor(code)
  const n = r.main.length + r.ext.length
  const isOpen = !!state.open[code]
  const badge = r.main.length
    ? `<span class="sl-badge sl-badge-success">主要對應 ${r.main.length} 個</span>`
    : r.ext.length ? `<span class="sl-badge sl-badge-amber">僅延伸 ${r.ext.length} 個</span>` : '<span class="sl-badge sl-badge-danger">沒有模擬</span>'
  const action = n
    ? `<button class="sl-btn" type="button" data-toggle="${code}" aria-expanded="${isOpen}">${isOpen ? '收合模擬' : '查看模擬'}</button>`
    : `<span class="sl-text-caption" style="color: var(--ink-muted);">${hasMine(code) ? '已有我的單元' : '日後可開發'}</span>`
  const grid = isOpen
    ? `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--space-2); margin-top: var(--space-3);">${r.main.map(s => simMini(s, 'main')).join('')}${r.ext.map(s => simMini(s, 'ext')).join('')}</div>`
    : ''
  return `
    <div class="sl-card">
      <div style="display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; justify-content: space-between;">
        <div style="display: grid; gap: var(--space-1); flex: 1 1 260px; min-width: 0;">
          <div style="display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center;"><span class="sl-text-label">${code}</span>${badge}</div>
          <div class="sl-text-body">${codeText[code]}</div>
          ${hanlinLine(code)}
          ${mineLine(code)}
        </div>
        ${action}
      </div>
      ${grid}
    </div>`
}

// 依條目：按主題分組
const renderByCode = () => {
  const pass = (c) => state.cover === 'all' || (state.cover === 'mine' ? hasMine(c) : state.cover === 'missing' ? !isCovered(c) : isCovered(c))
  const themes = themesOfStage(state.stage).filter(t => state.theme === 'all' || t === state.theme)
  // 只看我的單元時，沒有單元的主題整個不顯示，避免一長串空白卡片
  const shown = state.cover === 'mine' ? themes.filter(t => codesOfStage(state.stage).some(c => themeOf(c) === t && hasMine(c))) : themes
  if (!shown.length) return '<div class="sl-card"><div class="sl-text-body" style="color: var(--ink-muted);">這個學習階段還沒有自己的單元。</div></div>'
  return shown.map(t => {
    const codes = codesOfStage(state.stage).filter(c => themeOf(c) === t && pass(c))
    const body = codes.length
      ? `<div style="display: grid; gap: var(--space-2);">${codes.map(codeRow).join('')}</div>`
      : `<div class="sl-card"><div class="sl-text-body" style="color: var(--ink-muted);">${state.cover === 'mine' ? '這個主題還沒有自己的單元。' : state.cover === 'missing' ? '這個主題的條目都已有模擬可用。' : '這個主題目前沒有模擬對應。'}</div></div>`
    return `<section style="display: grid; gap: var(--space-3);"><div class="sl-text-title">${themeName[t]}</div>${body}</section>`
  }).join('')
}

// 依模擬：每張卡列出在目前階段的對應條目
const simCard = (s) => {
  const tag = (c, cls) => `<span class="sl-badge ${cls}" title="${codeText[c]}">${c}</span>`
  // 三個階段各一列，沒有對應的階段不顯示
  const codes = stages.map(st => {
    const main = s.main.filter(c => stageOf(c) === st.id)
    const ext = s.ext.filter(c => stageOf(c) === st.id)
    if (!main.length && !ext.length) return ''
    return `<div style="display: grid; gap: var(--space-1);"><span class="sl-text-caption" style="color: var(--ink-muted);">${st.name}</span><div style="display: flex; flex-wrap: wrap; gap: var(--space-1);">${main.map(c => tag(c, 'sl-badge-success')).join('')}${ext.map(c => tag(c, 'sl-badge-amber')).join('')}</div></div>`
  }).join('') || '<span class="sl-badge">沒有對應的學習內容條目</span>'
  // 國中條目落在哪些康軒章節
  const hs = [...new Set([...s.main, ...s.ext].filter(c => stageOf(c) === 'J').flatMap(c => textbookOf(c).map(h => `${h.book.slice(0, 2)} ${h.ch}`)))]
  const hl = hs.length ? `<div class="sl-text-caption" style="color: var(--ink-muted);">康軒章節：${hs.join('、')}</div>` : ''
  const note = hl + (s.note ? `<div class="sl-text-caption" style="color: var(--ink-muted);">${s.note}</div>` : '')
  return `
    <article class="sl-card" style="display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; border: 1px solid var(--line);">
      <a href="${s.url}" ${simLinkAttrs(s)} class="sl-text-label" style="color: var(--ink); font-size: 15px; line-height: 22px;">${s.t}</a>
      <div class="sl-text-caption" style="color: var(--ink-muted);">${s.q}</div>
      <div style="display: grid; gap: var(--space-2); margin-top: auto;">${codes}</div>
      ${note}
    </article>`
}

const renderBySim = () => {
  const cats = [...new Set(sims.map(s => s.cat))]
  const legend = '<div class="sl-row" style="padding: 0; gap: var(--space-2);"><span class="sl-badge sl-badge-success">主要對應</span><span class="sl-badge sl-badge-amber">延伸可用</span><span class="sl-text-caption" style="color: var(--ink-muted);">滑鼠移到代號上可看條目全文</span></div>'
  return legend + cats.map(cat => `
    <section style="display: grid; gap: var(--space-3);">
      <div class="sl-text-title">${cat}</div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--space-3);">${sims.filter(s => s.cat === cat).map(simCard).join('')}</div>
    </section>`).join('')
}

// 依康軒章節：每章列出條目，並可展開這章能用的模擬
const hanlinCard = (h) => {
  const isOpen = !!state.open['h:' + h.id]
  const tags = h.codes.map(c => `<div class="sl-text-caption" style="display: flex; gap: var(--space-2); align-items: baseline;"><span class="sl-badge ${isCovered(c) ? 'sl-badge-success' : 'sl-badge-danger'}" style="flex: none;">${c}</span><span style="color: var(--ink-muted);">${codeText[c] || ''}</span></div>`).join('')
  const mineHere = mineList((window.UNITS || []).filter(u => u.status !== 'external' && u.codes.some(c => h.codes.includes(c))))
  const usable = sims.filter(s => h.codes.some(c => s.main.includes(c) || s.ext.includes(c)))
  const status = usable.length
    ? `<span class="sl-badge sl-badge-success">可用模擬 ${usable.length} 個</span>`
    : '<span class="sl-badge sl-badge-danger">沒有模擬</span>'
  const action = usable.length
    ? `<button class="sl-btn" type="button" data-toggle="h:${h.id}" aria-expanded="${isOpen}">${isOpen ? '收合模擬' : '查看模擬'}</button>`
    : '<span class="sl-text-caption" style="color: var(--ink-muted);">日後可開發</span>'
  const kindOf = (s) => h.codes.some(c => s.main.includes(c)) ? 'main' : 'ext'
  const grid = isOpen
    ? `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--space-2); margin-top: var(--space-3);">${usable.map(s => simMini(s, kindOf(s))).join('')}</div>`
    : ''
  return `
    <div class="sl-card">
      <div style="display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; justify-content: space-between;">
        <div style="display: grid; gap: var(--space-1); flex: 1 1 260px; min-width: 0;">
          <div style="display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center;"><span class="sl-text-label">${h.ch}</span><span class="sl-badge">${h.subj}</span>${status}</div>
          <div class="sl-text-caption" style="color: var(--ink-muted);">${h.secs}</div>
          <div style="display: grid; gap: var(--space-1);">${tags}</div>
          ${mineHere}
        </div>
        ${action}
      </div>
      ${grid}
    </div>`
}

// 課程計畫沒有填到的國中條目，單獨列出，不自行歸章
const unlistedSection = () => {
  const used = new Set(textbook.flatMap(h => h.codes))
  const codes = codesOfStage('J').filter(c => !used.has(c))
  if (!codes.length) return ''
  return `
    <section style="display: grid; gap: var(--space-3);">
      <div class="sl-text-title">課程計畫未列出的條目</div>
      <div class="sl-text-caption" style="color: var(--ink-muted);">這些條目沒有出現在學校填寫的課程計畫中，章節位置請以課本為準。</div>
      <div style="display: grid; gap: var(--space-2);">${codes.map(codeRow).join('')}</div>
    </section>`
}

const renderByHanlin = () => {
  const books = [...new Set(textbook.map(h => h.book))]
  const legend = '<div class="sl-row" style="padding: 0; gap: var(--space-2);"><span class="sl-badge sl-badge-success">有模擬</span><span class="sl-badge sl-badge-danger">沒有模擬</span><span class="sl-text-caption" style="color: var(--ink-muted);">只列地科章節；理化章節請看「線上模擬與課綱對照」</span></div>'
  return legend + books.map(b => `
    <section style="display: grid; gap: var(--space-3);">
      <div class="sl-text-title">${b}</div>
      <div style="display: grid; gap: var(--space-2);">${textbook.filter(h => h.book === b).map(hanlinCard).join('')}</div>
    </section>`).join('') + unlistedSection()
}

const render = () => {
  // 康軒章節只屬國中，切到這個檢視時概況改看國中理化
  if (state.view === 'hanlin') state.stage = 'J'
  renderSummary()
  renderFilters()
  const views = { code: renderByCode, sim: renderBySim, hanlin: renderByHanlin }
  document.getElementById('list').innerHTML = views[state.view]()
}

// 我的單元連結：照導覽頁的方式開啟（寫入「繼續上次」）
document.getElementById('app').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-unit]')
  if (!a) return
  const u = (window.UNITS || []).find(x => x.id === a.dataset.unit)
  if (!u) return
  e.preventDefault()
  const p = Site.prefs()
  Site.openUnit(u, p.mode, p.cls, UNIT_PREFIX)
})

// 事件委派
document.getElementById('app').addEventListener('click', (e) => {
  const t = e.target.closest('button')
  if (!t) return
  const d = t.dataset
  if (d.stage) { state.stage = d.stage; state.theme = 'all'; state.view = d.stage === 'J' ? 'hanlin' : 'code' }
  else if (d.view) { state.view = d.view }
  else if (d.themeF) { state.theme = d.themeF }
  else if (d.cover) { state.cover = d.cover }
  else if (d.toggle) { state.open[d.toggle] = !state.open[d.toggle] }
  else return
  render()
})

document.getElementById('hanlin-src').innerHTML = tbSources.map(s => `<a href="${s.url}" target="_blank" rel="noopener" style="color: var(--ink-muted);">${s.name}</a>`).join('、')
render()
</script>
