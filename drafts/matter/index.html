      board: '水 ＋ 火把：分子\n氫氣和氧氣 ＋ 火把：分子' },
    { id: 's3', kind: 'task', title: 'STEP 3 動手操作', scene: 'separate', check: 'separate',
      prompt: '自己決定實驗步驟的順序，把燒杯中的沙子與食鹽分離出來。每個步驟只能用一次，順序錯了就按「重新開始」。',
      blanks: [
        { text: '第 1 步', options: ['加水攪拌', '過濾', '加熱蒸發'], answer: '加水攪拌' },
        { text: '第 2 步', options: ['加水攪拌', '過濾', '加熱蒸發'], answer: '過濾' },
        { text: '第 3 步', options: ['加水攪拌', '過濾', '加熱蒸發'], answer: '加熱蒸發' }
      ],
      ref: '加水攪拌 → 過濾 → 加熱蒸發',
      board: '分離沙子與食鹽的順序\n{加水攪拌*|過濾|加熱蒸發} → {加水攪拌|過濾*|加熱蒸發} → {加水攪拌|過濾|加熱蒸發*}' }
  ]

  // 動手任務的判定
  const CHECKS = {
    separate: { unit: '沙子與食鹽分開', done: () => sim.separated() }
  }

  // 預設教案：依教案格式（基本資料、學習目標、教學活動設計、附錄一學習單）
  const defaultPlan = {
    unit: '認識物質',
    designer: '',
    target: '國中二年級',
    time: '45分鐘',
    equipment: '電子白板、筆電、投影機、本模擬（有平板時可讓學生自行操作）',
    objTitle: '認識物質',
    cognitive: '學生能列舉物質三態的形狀、體積的不同',
    affective: '學生能和同儕分享觀察到的現象',
    skill: '學生能操作實驗步驟並拆分沙子與食鹽',
    phases: [
      { name: '準備活動', min: 3, items: [
        { text: '教師複習水的三態變化', min: 3, note: '' }
      ] },
      { name: '發展活動', min: 18, items: [
        { text: '教師以「投影上課」模式切換冰、水、水蒸氣與容器，引導學生列舉三態的形狀與體積差異（學習單 STEP 1）', min: 6, note: '模擬固定在「三態」畫面' },
        { text: '教師分別對水、氫氣和氧氣點燃火把，引導學生觀察分子的種類與數量，歸納物理變化與化學變化（學習單 STEP 2）', min: 6, note: '模擬固定在「兩種變化」畫面' },
        { text: '學生自己決定加水攪拌、過濾、加熱蒸發的順序並操作，把沙子與食鹽分開（學習單 STEP 3）', min: 6, note: '每個步驟只能用一次，順序錯了要重新開始' }
      ] },
      { name: '綜合活動', min: 24, items: [
        { text: '寫例題，讓學生練習', min: 24, note: '題號由教師自行填入' }
      ] }
    ]
  }

  // 網址參數：mode=prep|project|student，class=201～204（只在投影與學生作答使用）
  const startMode = Site.modeOf(location.search)
  const cls = Site.classOf(location.search)
  // 學生網址 #q= 帶的是老師改過的題目，蓋在預設題上；學生作答時才採用
  const shared = UnitShare.decode(location.hash, defaultSteps)
  const fromUrl = startMode === 'student' && (shared.loaded > 0 || shared.error)

  const store = {
    get: (key, fallback) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback } catch (e) { return fallback } },
    set: (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); return true } catch (e) { return false } }
  }
  const K = (name) => `${UNIT}.${name}`
  const KC = (name) => `${UNIT}.${cls}.${name}`

  const ui = {
    mode: startMode,
    // 舊存檔缺的欄位用預設題補上
    steps: fromUrl ? shared.steps : (store.get(K('steps'), null) || clone(defaultSteps)).map((st) => ({ ...clone(defaultSteps.find((d) => d.id === st.id) || {}), ...st })),
    shareOpen: false,
    plan: store.get(K('plan'), null) || clone(defaultPlan),
    qIndex: 0, sIndex: 0, editorOpen: false, showAnswer: false,
    answers: store.get(KC('answers'), {}),
    confirmed: store.get(KC('confirmed'), {}),
    student: store.get(KC('student'), ''),
    // 動手任務完成過就記在 tasksDone，重新開始或換步驟都不會消失
    tasksDone: store.get(KC('tasksDone'), {}),
    submitted: false, submitError: '', saveMsg: ''
  }

  const currentStep = () => ui.mode === 'project' ? ui.steps[ui.qIndex] : ui.mode === 'student' ? ui.steps[ui.sIndex] : null
  const checkDone = (s) => { const c = CHECKS[s.check]; return !!c && c.done() }
  const taskDone = (s) => !!ui.tasksDone[s.id] || (currentStep() === s && checkDone(s))
  // 模擬做完一個分離步驟：達成條件就記下來，並更新側欄的進度
  document.addEventListener('sim:sep-step', () => {
    const s = currentStep()
    if (s && s.kind === 'task' && checkDone(s) && !ui.tasksDone[s.id]) { ui.tasksDone[s.id] = true; store.set(KC('tasksDone'), ui.tasksDone) }
    if (ui.mode === 'student' && !ui.submitted) renderSide()
  })
  // 換到另一步：模擬切到這一步的畫面並鎖住（備課時不限制）
  const applyScene = () => { const s = currentStep(); sim.lockScene((s && s.scene) || null) }
  const goStep = (key, i) => {
    const next = Math.max(0, Math.min(ui.steps.length - 1, i))
    if (next === ui[key]) return
    ui[key] = next; ui.showAnswer = false
    applyScene()
  }

  // ---------- 備課：教案 ----------
  const itemsMin = (ph) => ph.items.reduce((s, it) => s + (Number(it.min) || 0), 0)
  const phaseMin = (ph) => Number(ph.min) || 0
  const planTotal = () => ui.plan.phases.reduce((s, ph) => s + phaseMin(ph), 0)
  const targetMin = () => { const m = String(ui.plan.time || '').match(/\d+/); return m ? parseInt(m[0], 10) : null }
  const phaseHint = (ph) => itemsMin(ph) !== phaseMin(ph) ? `各項合計 ${itemsMin(ph)} 分鐘` : ''

  // 教案表格：用行內樣式，複製到 Word 時才會保留框線
  const planTableHtml = (editable) => {
    const pl = ui.plan
    const ce = (path) => editable ? ` contenteditable="true" data-plan="${path}"` : ''
    const td = 'style="border: 1px solid #999; padding: 6px 8px; vertical-align: top; text-align: left;"'
    const th = 'style="border: 1px solid #999; padding: 6px 8px; vertical-align: top; text-align: left; font-weight: bold; white-space: nowrap;"'
    const field = (label, key) => `<tr><td ${th}>${label}</td><td ${td} colspan="3"${ce(key)}>${esc(pl[key])}</td></tr>`
    const rows = pl.phases.map((ph, pi) => `
      <tr><td ${td} colspan="2"><strong>${pi + 1}. ${esc(ph.name)}（<span${ce(`phases.${pi}.min`)}>${phaseMin(ph)}</span>分鐘）</strong>${editable ? ` <span class="note" data-phase-hint="${pi}">${phaseHint(ph)}</span>` : ''}</td><td ${td}></td><td ${td}></td></tr>
      ${ph.items.map((it, ii) => `<tr>
        <td ${td} colspan="2"${ce(`phases.${pi}.items.${ii}.text`)}>${esc(it.text)}</td>
        <td ${td.replace('"', '"white-space: nowrap; ')}><span${ce(`phases.${pi}.items.${ii}.min`)}>${esc(it.min)}</span> 分鐘</td>
        <td ${td}${ce(`phases.${pi}.items.${ii}.note`)}>${esc(it.note)}</td>
      </tr>`).join('')}`).join('')
    return `<table class="plan-table" style="border-collapse: collapse; width: 100%; table-layout: fixed;">
      <colgroup><col style="width: 20%;"><col style="width: 50%;"><col style="width: 12%;"><col style="width: 18%;"></colgroup>
      ${field('課程單元名稱', 'unit')}
      ${field('教案設計者', 'designer')}
      ${field('教學對象', 'target')}
      ${field('教學時間', 'time')}
      ${field('教學設備/資源', 'equipment')}
      <tr><td ${th} colspan="4">學習目標</td></tr>
      <tr><td ${td} colspan="4">
        <span${ce('objTitle')}>${esc(pl.objTitle)}</span>：<br>
        ●認知：<span${ce('cognitive')}>${esc(pl.cognitive)}</span><br>
        ●情意：<span${ce('affective')}>${esc(pl.affective)}</span><br>
        ●技能：<span${ce('skill')}>${esc(pl.skill)}</span>
      </td></tr>
      <tr><td ${th} colspan="2">教學活動設計</td><td ${th}>時間</td><td ${th}>備註</td></tr>
      ${rows}
    </table>`
  }

  // 附錄一 學習單：withAnswer 為 true 時是參考答案版
  const worksheetHtml = (withAnswer) => {
    const line = '＿＿＿＿＿＿'
    const u = (t) => `<u>${esc(t)}</u>`
    const cell = 'style="border: 1px solid #999; padding: 2px 8px; text-align: left;"'
    // 分離結果的紀錄表：濾紙和蒸發皿上留下什麼
    const recTable = () => `<table style="border-collapse: collapse; margin: 4px 0;"><tr><th ${cell}>位置</th><th ${cell}>留下的東西</th></tr>
      ${[['濾紙上', '沙子'], ['蒸發皿', '食鹽晶體']].map(([where, what]) => `<tr><td ${cell}>${where}</td><td ${cell}>${withAnswer ? esc(what) : '　　　　　　'}</td></tr>`).join('')}</table>`
    const body = ui.steps.map((s) => {
      const parts = []
      if (s.kind === 'task') parts.push(recTable())
      ;(s.blanks || []).forEach((b) => parts.push(`${esc(b.text)} ${withAnswer ? u(b.answer) : line}。`))
      if (s.ask) parts.push(`${esc(s.ask)}${withAnswer ? u(s.ref || '') : line + line + line}`)
      if (s.kind === 'text') parts.push(withAnswer ? u(s.ref || '') : `${esc(s.starter || '')}${line}${line}${line}<br>${line}${line}${line}`)
      return `<li style="margin-bottom: 10px;"><strong>${esc(s.title)}</strong>：${esc(s.prompt)}<br>${parts.join('<br>')}</li>`
    }).join('')
    const name = withAnswer ? `班級與座號：${u('二年忠班 12')}　姓名：${u('王小明')}` : `班級與座號：${line}　姓名：${line}`
    return `<div>
      <p style="font-weight: bold; margin: 0 0 6px;">附錄一　${esc(ui.plan.objTitle)}探究學習單${withAnswer ? '（參考答案）' : ''}</p>
      <p style="margin: 0 0 8px;">${name}</p>
      <ul style="padding-left: 1.2em; margin: 0;">${body}</ul>
    </div>`
  }

  const lessonDocHtml = () => `<div style="font-family: 標楷體, 'DFKai-SB', serif; font-size: 12pt;">
    ${planTableHtml(false)}<br>${worksheetHtml(false)}<br>${worksheetHtml(true)}</div>`

  const lessonText = () => {
    const pl = ui.plan
    const lines = [
      `課程單元名稱：${pl.unit}`, `教案設計者：${pl.designer}`, `教學對象：${pl.target}`, `教學時間：${pl.time}`, `教學設備/資源：${pl.equipment}`,
      '', '學習目標', `${pl.objTitle}：`, `●認知：${pl.cognitive}`, `●情意：${pl.affective}`, `●技能：${pl.skill}`, '', '教學活動設計｜時間｜備註'
    ]
    pl.phases.forEach((ph, pi) => {
      lines.push(`${pi + 1}. ${ph.name}（${phaseMin(ph)}分鐘）`)
      ph.items.forEach((it) => lines.push(`- ${it.text}｜${it.min} 分鐘｜${it.note}`))
    })
    return lines.join('\n')
  }

  const planWarnHtml = () => {
    const total = planTotal(), target = targetMin()
    if (target === null) return `<p class="note">三個階段合計 ${total} 分鐘</p>`
    return total !== target
      ? `<div class="msg-error">三個階段合計 ${total} 分鐘，和教學時間 ${target} 分鐘不符。</div>`
      : `<p class="note">三個階段合計 ${total} 分鐘，和教學時間相符。</p>`
  }
  const updatePlanTotals = () => {
    document.querySelectorAll('[data-phase-hint]').forEach((el) => { el.textContent = phaseHint(ui.plan.phases[+el.dataset.phaseHint]) })
    const warn = $('planWarn')
    if (warn) warn.innerHTML = planWarnHtml()
  }

  const renderPrep = () => {
    const editors = ui.steps.map((s, si) => {
      const blanks = (s.blanks || []).map((b, bi) => `
        <div class="edit-blank">
          <label class="note" for="bt-${si}-${bi}">填空 ${bi + 1} 的題目</label>
          <input type="text" id="bt-${si}-${bi}" data-edit="blank-text" data-s="${si}" data-b="${bi}" value="${esc(b.text)}">
          <label class="note" for="bo-${si}-${bi}">選項（用「、」分隔）</label>
          <input type="text" id="bo-${si}-${bi}" data-edit="blank-options" data-s="${si}" data-b="${bi}" value="${esc(b.options.join('、'))}">
          <label class="note" for="ba-${si}-${bi}">正確答案</label>
          <select id="ba-${si}-${bi}" data-edit="blank-answer" data-s="${si}" data-b="${bi}">
            ${b.options.map((o) => `<option ${o === b.answer ? 'selected' : ''}>${esc(o)}</option>`).join('')}
          </select>
        </div>`).join('')
      const kindLabel = { text: '自由作答', cloze: '選擇填空', task: `動手任務：${CHECKS[s.check] ? CHECKS[s.check].unit : ''}` }[s.kind]
      return `
        <div class="edit-step">
          <div class="row"><strong>${esc(s.title)}</strong><span class="sl-badge">${kindLabel}</span></div>
          <label class="note" for="st-${si}">步驟名稱</label>
          <input type="text" id="st-${si}" data-edit="title" data-s="${si}" value="${esc(s.title)}">
          <label class="note" for="sp-${si}">說明文字</label>
          <textarea id="sp-${si}" data-edit="prompt" data-s="${si}">${esc(s.prompt)}</textarea>
          <label class="note" for="sb-${si}">投影板書（選項用 { } 包起來、用 | 分開，正確答案後面加 *，例如 {固定*|隨容器改變}；按 Enter 換行，一行一個問題）</label>
          <textarea id="sb-${si}" data-edit="board" data-s="${si}" style="min-height: 50px;">${esc(s.board || '')}</textarea>
          ${s.kind !== 'cloze' ? `<label class="note" for="sr-${si}">參考回答（放進參考答案版）</label>
          <textarea id="sr-${si}" data-edit="ref" data-s="${si}" style="min-height: 50px;">${esc(s.ref || '')}</textarea>` : ''}
          ${blanks}
        </div>`
    }).join('')

    $('side').innerHTML = `
      <h2 class="sl-text-title">教案</h2>
      <p class="note">表格內的文字都可以直接點進去修改，改完會自動儲存。三個階段的合計會和教學時間比對。</p>
      <div class="table-wrap plan-wrap">${planTableHtml(true)}</div>
      <div id="planWarn">${planWarnHtml()}</div>
      <div class="row">
        <button class="sl-btn sl-btn-primary" type="button" data-act="copy-lesson">複製教案</button>
        <button class="sl-btn" type="button" data-act="reset-plan">還原預設教案</button>
        <span class="note" id="copyMsg"></span>
      </div>
      <p class="note">複製後可以直接貼到 Word，表格格式會保留；內容包含教案、學習單和參考答案。</p>
      <h2 class="sl-text-title">附錄一　學習單</h2>
      <div class="paper">${worksheetHtml(false)}</div>
      <div class="paper">${worksheetHtml(true)}</div>
      <details id="stepEditor" ${ui.editorOpen ? 'open' : ''}>
        <summary><strong>修改學習單題目</strong></summary>
        <div style="display: grid; gap: var(--space-3); margin-top: var(--space-2);">
          <p class="note">修改後按「儲存題目」，附錄一、投影板書與學生作答會一起更新。</p>
          ${editors}
          ${ui.saveMsg}
          <div class="row">
            <button class="sl-btn" type="button" data-act="save-steps">儲存題目</button>
            <button class="sl-btn" type="button" data-act="reset-steps">還原預設題</button>
          </div>
        </div>
      </details>`
  }

  // ---------- 投影上課：板書精簡，留白給老師在白板上寫 ----------
  // 板書語法：{選項一|選項二*|選項三}，* 標示正確答案；只在空白處換行
  const boardWords = (t) => t.split(/[ 　]+/).filter(Boolean).map((w) => `<span class="bw">${w}</span>`).join(' ')
  const boardLine = (line, reveal) => esc(line).split(/(\{[^}]*\})/).map((part) => part.startsWith('{') ? part : boardWords(part)).join(' ').replace(/\{([^}]*)\}/g, (m, inner) => {
    const opts = inner.split('|').map((o) => o.trim()).filter(Boolean)
    return `<span class="opts">${opts.map((o) => {
      const ok = o.endsWith('*')
      const label = ok ? o.slice(0, -1).trim() : o
      return `<span class="opt${reveal && ok ? ' opt-correct' : ''}">${label}</span>`
    }).join('<span class="opt-sep">／</span>')}</span>`
  })
  const boardHtml = (text, reveal) => String(text || '').split(/\n/).filter((l) => l.trim())
    .map((l) => `<div class="board-line">${boardLine(l.trim(), reveal)}</div>`).join('')

  const renderProject = () => {
    const s = ui.steps[ui.qIndex]
    const hasAnswer = /\*\s*[|}]/.test(s.board || '')
    $('side').innerHTML = `
      <div class="board-nav">
        <span class="sl-badge sl-badge-amber">${esc(s.title)}　${ui.qIndex + 1} / ${ui.steps.length}</span>
        <div class="row">
          <button class="sl-btn" type="button" data-act="q-prev" ${ui.qIndex === 0 ? 'disabled' : ''}>上一題</button>
          ${hasAnswer ? `<button class="sl-btn" type="button" data-act="q-answer">${ui.showAnswer ? '隱藏答案' : '顯示答案'}</button>` : ''}
          <button class="sl-btn sl-btn-primary" type="button" data-act="q-next" ${ui.qIndex === ui.steps.length - 1 ? 'disabled' : ''}>下一題</button>
        </div>
      </div>
      <div class="board-text">${boardHtml(s.board || s.title, ui.showAnswer)}</div>
      <div class="row"><button class="sl-btn" type="button" data-act="share">發給學生</button></div>
      ${ui.shareOpen ? shareCardHtml() : ''}
      <div class="write-area" aria-hidden="true"></div>`
  }

  // ---------- 投影上課：發給學生（QR code 與學生網址） ----------
  const QR_ERR = 'QR code 元件載入失敗，請檢查網路後重新整理。網址仍可複製。'
  const shareCardHtml = () => {
    let link
    try {
      link = UnitShare.studentUrl(location.origin + location.pathname, cls, ui.steps, defaultSteps)
    } catch (e) {
      return '<div class="share-card"><div class="msg-error">學生網址產生失敗：網址壓縮元件載入失敗，請檢查網路後重新整理。</div></div>'
    }
    const k = UnitShare.changedSteps(ui.steps, defaultSteps).length
    let qr
    if (typeof qrcode === 'undefined') qr = `<div class="msg-error">${QR_ERR}</div>`
    else {
      try {
        const code = qrcode(0, 'M')
        code.addData(link)
        code.make()
        qr = `<div class="qr-box"><img src="${code.createDataURL(6, 2)}" alt="學生網址的 QR code"></div>`
      } catch (e) {
        qr = '<div class="msg-error">網址太長，無法產生 QR code，請少改幾題。網址仍可複製。</div>'
      }
    }
    const note = k
      ? `網址長度 ${link.length} 字元。你改過的 ${k} 題已放進網址，其餘用預設題。學生不用登入。`
      : '沒有改過題目，學生看到的是預設題。'
    return `<div class="share-card">
      <div class="row" style="justify-content: space-between;"><strong>請學生用手機掃描</strong><span class="sl-badge">${esc(Site.classLabel(cls))}</span></div>
      ${qr}
      <p class="share-url" id="shareUrl">${esc(link)}</p>
      <p class="note">${note}${link.length > 2000 ? '網址很長，QR code 可能不好掃，建議少改幾題。' : ''}</p>
      <div class="row">
        <button class="sl-btn" type="button" data-act="share-copy">複製網址</button>
        <button class="sl-btn" type="button" data-act="share-close">收起</button>
        <span class="note" id="shareMsg"></span>
      </div>
    </div>`
  }

  // ---------- 學生作答 ----------
  const hasText = (s) => s.kind === 'text' || !!s.ask
  const textOf = (s) => (ui.answers[s.id] || '').trim()
  // 去掉句型開頭和標點後要有內容，且不能只寫「無」
  const textValid = (s) => {
    const core = textOf(s).replace(s.starter || '', '').replace(/[\s，。、,.…：:]/g, '')
    return !!core && !/^(無|沒有|沒|不知道)$/.test(core)
  }
  const stepAnswer = (s) => JSON.stringify([hasText(s) ? textOf(s) : '', ...(s.blanks || []).map((b, bi) => ui.answers[`${s.id}-${bi}`] || '')])
  const stepFilled = (s) => (!hasText(s) || textValid(s)) && (s.blanks || []).every((b, bi) => !!ui.answers[`${s.id}-${bi}`])
  const needsConfirm = (s) => hasText(s) || (s.blanks || []).length > 0
  const canConfirm = (s) => stepFilled(s) && ui.confirmed[s.id] !== stepAnswer(s)
  const confirmNote = (s) => {
    if (hasText(s) && textOf(s) && textOf(s) !== s.starter && !textValid(s)) return '請寫出具體的內容，不能寫「無」'
    return !ui.confirmed[s.id] ? '' : (ui.confirmed[s.id] !== stepAnswer(s) ? '已修改，按確定更新' : '已記錄')
  }
  const isAnswered = (s) => (s.kind !== 'task' || taskDone(s)) && (!needsConfirm(s) || !!ui.confirmed[s.id])

  const updateConfirmBtn = (stepId) => {
    const st = ui.steps.find((x) => x.id === stepId)
    const btn = document.querySelector(`[data-confirm="${stepId}"]`)
    if (st && btn) btn.disabled = !canConfirm(st)
    const note = document.querySelector(`[data-note="${stepId}"]`)
    if (st && note) note.textContent = confirmNote(st)
  }

  const renderStudent = () => {
    if (ui.submitted) return renderSummary()
    const done = ui.steps.filter(isAnswered).length
    const pct = Math.round(done / ui.steps.length * 100)
    // 一次只顯示一步
    const steps = [ui.steps[ui.sIndex]].map((s) => {
      const parts = []
      if (s.kind === 'task') {
        parts.push(taskDone(s)
          ? '<span><span class="sl-badge sl-badge-success">動手任務完成</span></span>'
          : '<span><span class="sl-badge">進行中：沙子與食鹽還沒分開</span></span>')
      }
      ;(s.blanks || []).forEach((b, bi) => parts.push(`<div>${esc(b.text)}
        <select data-ans="${s.id}-${bi}" aria-label="${esc(b.text)}">
          <option value="">請選擇</option>
          ${b.options.map((o) => `<option ${ui.answers[`${s.id}-${bi}`] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
        </select>。</div>`))
      if (s.ask) parts.push(`<label for="ta-${s.id}">${esc(s.ask)}</label>`)
      if (hasText(s)) parts.push(`<textarea id="ta-${s.id}" data-ans="${s.id}" aria-label="${esc(s.ask || s.title)}">${esc(ui.answers[s.id] !== undefined ? ui.answers[s.id] : (s.starter || ''))}</textarea>`)
      if (needsConfirm(s)) parts.push(`<div class="confirm-row">
        <span class="note" data-note="${s.id}">${confirmNote(s)}</span>
        <button class="sl-btn" type="button" data-act="confirm" data-confirm="${s.id}" ${canConfirm(s) ? '' : 'disabled'}>確定</button>
      </div>`)
      return `<div class="ws-step"><strong>${esc(s.title)}</strong><div>${esc(s.prompt)}</div>${parts.join('')}</div>`
    }).join('')

    $('side').innerHTML = `
      <h2 class="sl-text-title">探究學習單</h2>
      ${fromUrl && shared.loaded ? `<div><span class="sl-badge sl-badge-success">已載入老師更新的 ${shared.loaded} 題</span></div>` : ''}
      ${fromUrl && shared.error ? '<div><span class="sl-badge sl-badge-danger">題目沒有載入</span></div><div class="msg-error">這個網址的題目資料不完整，先用預設題目作答。請向老師要新的網址。</div>' : ''}
      <label for="studentName"><strong>座號與姓名</strong></label>
      <input type="text" id="studentName" placeholder="例如：12 王小明" value="${esc(ui.student)}">
      <div class="sl-progress">
        <div class="sl-progress-head"><span>完成進度</span><span class="sl-progress-num">${done} / ${ui.steps.length}</span></div>
        <div class="sl-progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="完成進度"><div class="sl-progress-fill" style="width: ${pct}%;"></div></div>
      </div>
      <div class="board-nav">
        <span class="sl-badge">${ui.sIndex + 1} / ${ui.steps.length}${isAnswered(ui.steps[ui.sIndex]) ? '　已完成' : ''}</span>
        <div class="row">
          <button class="sl-btn" type="button" data-act="s-prev" ${ui.sIndex === 0 ? 'disabled' : ''}>上一步</button>
          <button class="sl-btn" type="button" data-act="s-next" ${ui.sIndex === ui.steps.length - 1 ? 'disabled' : ''}>下一步</button>
        </div>
      </div>
      ${steps}
      ${ui.submitError ? `<div class="msg-error">${esc(ui.submitError)}</div>` : ''}
      <button class="sl-btn sl-btn-primary" type="button" data-act="submit">交出學習單</button>
      <p class="note">作答會暫存在這台裝置上，重新整理不會消失。</p>`
  }

  const summaryText = () => {
    const lines = [`認識物質學習單｜${Site.classLabel(cls)}｜${ui.student}`]
    ui.steps.forEach((s) => {
      if (s.kind === 'task') lines.push(`${s.title}：動手任務${taskDone(s) ? '完成' : '未完成'}`)
      ;(s.blanks || []).forEach((b, bi) => {
        const a = ui.answers[`${s.id}-${bi}`] || '（未作答）'
        lines.push(`${s.title}：${b.text} ${a}（${a === b.answer ? '正確' : '再想想'}）`)
      })
      if (hasText(s)) lines.push(`${s.title}：${textOf(s) || '（未作答）'}`)
    })
    return lines.join('\n')
  }

  const renderSummary = () => {
    const cloze = ui.steps.flatMap((s) => (s.blanks || []).map((b, bi) => ({ s, b, a: ui.answers[`${s.id}-${bi}`] })))
    const right = cloze.filter((x) => x.a === x.b.answer).length
    $('side').innerHTML = `
      <h2 class="sl-text-title">作答摘要</h2>
      <div class="msg-ok">已交出：${esc(ui.student)}</div>
      <p>選擇填空答對 <strong>${right} / ${cloze.length}</strong>，動手任務完成 <strong>${ui.steps.filter((s) => s.kind === 'task' && taskDone(s)).length} / ${ui.steps.filter((s) => s.kind === 'task').length}</strong>。</p>
      ${cloze.map((x) => `<div class="ws-step"><strong>${esc(x.s.title)}</strong><div>${esc(x.b.text)} <strong>${esc(x.a || '（未作答）')}</strong>
        <span class="sl-badge ${x.a === x.b.answer ? 'sl-badge-success' : 'sl-badge-danger'}">${x.a === x.b.answer ? '正確' : '再想想'}</span></div></div>`).join('')}
      <label class="note" for="summaryBox">複製下面文字，貼到 Classroom 或傳給老師</label>
      <textarea id="summaryBox" readonly style="min-height: 160px;">${esc(summaryText())}</textarea>
      <div class="row">
        <button class="sl-btn sl-btn-primary" type="button" data-act="copy-summary">複製摘要</button>
        <button class="sl-btn" type="button" data-act="back-edit">回到作答</button>
        <span class="note" id="copyMsg"></span>
      </div>`
  }

  const renderSide = () => ({ prep: renderPrep, project: renderProject, student: renderStudent })[ui.mode]()

  // ---------- 剪貼簿 ----------
  const copyText = (text, fallbackEl) => {
    const msg = $('copyMsg')
    const done = (ok) => { if (msg) msg.textContent = ok ? '已複製' : '無法自動複製，已選取文字，請按 Ctrl＋C' }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true)).catch(() => { if (fallbackEl) fallbackEl.select(); done(false) })
    } else { if (fallbackEl) fallbackEl.select(); done(false) }
  }
  const copyRich = (html, text) => {
    const msg = $('copyMsg')
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        const item = new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })
        navigator.clipboard.write([item]).then(() => { if (msg) msg.textContent = '已複製，可直接貼到 Word' }).catch(() => copyText(text))
        return
      }
    } catch (e) { /* 改用純文字 */ }
    copyText(text)
  }

  const setPlanPath = (path, value) => {
    const keys = path.split('.')
    let obj = ui.plan
    keys.slice(0, -1).forEach((k) => { obj = obj[k] })
    const last = keys[keys.length - 1]
    obj[last] = last === 'min' ? (parseInt(value, 10) || 0) : value
    store.set(K('plan'), ui.plan)
  }

  const readEditors = () => {
    const steps = clone(ui.steps)
    document.querySelectorAll('[data-edit]').forEach((el) => {
      const s = steps[+el.dataset.s]
      const b = el.dataset.b !== undefined ? s.blanks[+el.dataset.b] : null
      const v = el.value.trim()
      if (el.dataset.edit === 'title') s.title = v || s.title
      if (el.dataset.edit === 'prompt') s.prompt = v
      if (el.dataset.edit === 'ref') s.ref = v
      if (el.dataset.edit === 'board') s.board = el.value.split('\n').map((l) => l.trim()).filter(Boolean).join('\n')
      if (el.dataset.edit === 'blank-text') b.text = v
      if (el.dataset.edit === 'blank-options') b.options = el.value.split(/[、,，]/).map((x) => x.trim()).filter(Boolean)
      if (el.dataset.edit === 'blank-answer') b.answer = el.value
    })
    steps.forEach((s) => (s.blanks || []).forEach((b) => { if (!b.options.includes(b.answer)) b.answer = b.options[0] || '' }))
    return steps
  }

  // ---------- 模式切換 ----------
  const setMode = (mode) => {
    ui.mode = mode
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === mode)))
    $('app').classList.toggle('projecting', mode === 'project')
    $('app').classList.toggle('prepping', mode === 'prep')
    $('taskCard').hidden = mode !== 'prep'
    const badge = $('classBadge')
    badge.hidden = mode === 'prep'
    badge.textContent = Site.classLabel(cls)
    const q = new URLSearchParams({ mode })
    if (mode !== 'prep') q.set('class', cls)
    try { const u = new URL(location.href); u.search = `?${q}`; history.replaceState(null, '', u) } catch (e) { /* 網址改不了也不影響 */ }
    applyScene()
    renderSide()
    sim.relayout()
  }
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.view)))

  // ---------- 側欄事件 ----------
  $('side').addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]')
    if (!t) return
    const act = t.dataset.act
    if (act === 'copy-lesson') copyRich(lessonDocHtml(), lessonText())
    if (act === 'reset-plan') { ui.plan = clone(defaultPlan); store.set(K('plan'), ui.plan); renderSide() }
    if (act === 'save-steps') {
      ui.steps = readEditors()
      ui.saveMsg = store.set(K('steps'), ui.steps) ? '<div class="msg-ok">題目已儲存</div>' : '<div class="msg-error">這台裝置無法儲存，題目只在這次開啟期間有效</div>'
      renderSide()
    }
    if (act === 'reset-steps') { ui.steps = clone(defaultSteps); store.set(K('steps'), ui.steps); ui.saveMsg = '<div class="msg-ok">已還原預設題</div>'; renderSide() }
    if (act === 'q-prev') { goStep('qIndex', ui.qIndex - 1); renderSide() }
    if (act === 'q-next') { goStep('qIndex', ui.qIndex + 1); renderSide() }
    if (act === 's-prev') { goStep('sIndex', ui.sIndex - 1); renderSide() }
    if (act === 's-next') { goStep('sIndex', ui.sIndex + 1); renderSide() }
    if (act === 'q-answer') { ui.showAnswer = !ui.showAnswer; renderSide() }
    if (act === 'submit') {
      if (!ui.student.trim()) { ui.submitError = '請先填寫座號與姓名，再交出學習單。'; renderSide(); $('studentName').focus(); return }
      ui.submitError = ''; ui.submitted = true; renderSide()
    }
    if (act === 'confirm') {
      const st = ui.steps.find((x) => x.id === t.dataset.confirm)
      if (!st || !canConfirm(st)) return
      ui.confirmed[st.id] = stepAnswer(st)
      store.set(KC('confirmed'), ui.confirmed)
      renderSide()
    }
    if (act === 'copy-summary') copyText(summaryText(), $('summaryBox'))
    if (act === 'share') { ui.shareOpen = true; renderSide() }
    if (act === 'share-close') { ui.shareOpen = false; renderSide() }
    if (act === 'share-copy') {
      const text = $('shareUrl').textContent
      const fail = () => {
        const r = document.createRange(); r.selectNodeContents($('shareUrl'))
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r)
        $('shareMsg').textContent = '無法自動複製，請選取上方網址後按 Ctrl＋C'
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { $('shareMsg').textContent = '已複製' }).catch(fail)
      else fail()
    }
    if (act === 'back-edit') { ui.submitted = false; renderSide() }
  })
  $('side').addEventListener('input', (e) => {
    const el = e.target
    if (el.dataset && el.dataset.plan) { setPlanPath(el.dataset.plan, el.textContent.trim()); if (el.dataset.plan.endsWith('.min') || el.dataset.plan === 'time') updatePlanTotals(); return }
    if (el.id === 'studentName') { ui.student = el.value; store.set(KC('student'), ui.student); return }
    if (el.dataset.ans) {
      ui.answers[el.dataset.ans] = el.value
      store.set(KC('answers'), ui.answers)
      updateConfirmBtn(el.dataset.ans.split('-')[0])
    }
  })
  // 下拉選單在部分瀏覽器只觸發 change
  $('side').addEventListener('change', (e) => {
    const el = e.target
    if (el.dataset.ans && el.tagName === 'SELECT') { ui.answers[el.dataset.ans] = el.value; store.set(KC('answers'), ui.answers); updateConfirmBtn(el.dataset.ans.split('-')[0]) }
    if (el.dataset.edit !== 'blank-options') return
    const sel = $(`ba-${el.dataset.s}-${el.dataset.b}`)
    const opts = el.value.split(/[、,，]/).map((x) => x.trim()).filter(Boolean)
    const cur = sel.value
    sel.innerHTML = opts.map((o) => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('')
  })
  $('side').addEventListener('focusout', (e) => {
    const el = e.target
    if (el.dataset && el.dataset.plan && el.dataset.plan.endsWith('.min')) { el.textContent = String(parseInt(el.textContent, 10) || 0); updatePlanTotals() }
  })
  $('side').addEventListener('toggle', (e) => { if (e.target.id === 'stepEditor') ui.editorOpen = e.target.open }, true)

  // 學生用網址開啟時，不顯示回導覽
  $('backNav').hidden = startMode === 'student'
  setMode(ui.mode)
  // 給測試用
  window.matterUnit = { ui, defaultSteps, defaultPlan, planTotal, isAnswered, taskDone, setMode, cls }
})()
</script>
</body>
</html>
