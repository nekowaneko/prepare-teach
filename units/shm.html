<title>簡諧運動投影與匹配</title>
<style>
  /* 沿用原作品的兩套主題：現代模式與黑板模式 */
  :root {
    --bg-color: #eef2f5;
    --panel-bg: #ffffff;
    --text-color: #2c3e50;
    --muted-color: #5d6d7e;
    --accent-color: #3498db;
    --border-color: #dcdde1;
    --canvas-bg: #f8f9fa;
    --x-color: #2ecc71;
    --v-color: #e74c3c;
    --a-color: #9b59b6;
    --shadow-color: #7f8c8d;
    --ok-bg: rgba(46, 204, 113, 0.18);
    --ok-text: #1e8449;
    --bad-bg: rgba(231, 76, 60, 0.15);
    --bad-text: #c0392b;
    --font-family: 'Inter', system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  :root[data-theme="blackboard"] {
    --bg-color: #1a2a22;
    --panel-bg: #22382c;
    --text-color: #f0f0f0;
    --muted-color: #c7d3cc;
    --accent-color: #f1c40f;
    --border-color: #34493d;
    --canvas-bg: #1a2a22;
    --x-color: #2ecc71;
    --v-color: #ff6b6b;
    --a-color: #a29bfe;
    --shadow-color: #b2bec3;
    --ok-bg: rgba(46, 204, 113, 0.2);
    --ok-text: #6fe39b;
    --bad-bg: rgba(255, 107, 107, 0.18);
    --bad-text: #ff9b9b;
    --font-family: 'Chalkboard SE', 'Comic Sans MS', cursive, system-ui, sans-serif;
    color-scheme: dark;
  }

  body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  #app {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 440px;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 12px;
    padding: 12px;
    height: 100vh;
    font-size: 17px;
  }

  /* 上方模式列 */
  .topbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 1.15em; margin: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { font: inherit; font-size: 0.9em; font-weight: bold; padding: 8px 14px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--panel-bg); color: var(--text-color); cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
  :root[data-theme="blackboard"] .tab[aria-pressed="true"] { color: #1a2a22; }

  .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); overflow-y: auto; min-width: 0; }
  .panel h2 { font-size: 1.15em; margin: 0 0 12px; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; }
  .panel h3 { font-size: 1em; margin: 14px 0 8px; }

  .control-group { margin-bottom: 14px; background: rgba(0, 0, 0, 0.03); padding: 10px; border-radius: 8px; }
  :root[data-theme="blackboard"] .control-group { background: rgba(255, 255, 255, 0.03); }
  .control-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { flex-grow: 1; accent-color: var(--accent-color); cursor: pointer; min-width: 0; }
  .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
  .checkbox-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

  .btn { font: inherit; background: var(--accent-color); color: #fff; border: none; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9em; font-weight: bold; }
  :root[data-theme="blackboard"] .btn { color: #1a2a22; }
  .btn-outline { background: transparent; color: var(--text-color); border: 2px solid var(--border-color); }
  :root[data-theme="blackboard"] .btn-outline { color: var(--text-color); }
  .btn-block { width: 100%; margin-bottom: 8px; }
  .confirm-row { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 8px; }
  .btn-confirm { min-width: 84px; }
  .btn:disabled { background: var(--border-color); color: var(--muted-color); cursor: not-allowed; }
  .btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent-color); outline-offset: 2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* 動畫區 */
  .stage { display: flex; min-height: 0; min-width: 0; }
  .canvas-container { background: var(--canvas-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; position: relative; flex-grow: 1; min-height: 420px; }
  .canvas-state { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted-color); font-weight: bold; }
  #thetaLabel { position: absolute; pointer-events: none; transform: translate(-50%, -50%); font-size: 18px; font-style: italic; }

  /* 右側面板共用 */
  .hint-box { padding: 12px 14px; border-left: 5px solid var(--accent-color); border-radius: 6px; line-height: 1.6; margin-bottom: 12px; background: rgba(52, 152, 219, 0.08); }
  .muted { color: var(--muted-color); font-size: 0.88em; }
  .badge { display: inline-block; font-size: 0.75em; font-weight: bold; padding: 1px 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.07); }
  :root[data-theme="blackboard"] .badge { background: rgba(255, 255, 255, 0.1); }
  .badge-ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge-bad { background: var(--bad-bg); color: var(--bad-text); }
  .match-status { text-align: center; font-weight: bold; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
  .match-success { background: var(--ok-bg); color: var(--ok-text); border: 2px solid var(--x-color); }
  .match-fail { background: var(--bad-bg); color: var(--bad-text); border: 2px solid var(--v-color); }
  .msg-error { background: var(--bad-bg); color: var(--bad-text); padding: 8px 12px; border-radius: 8px; margin: 8px 0; font-weight: bold; }
  .msg-ok { background: var(--ok-bg); color: var(--ok-text); padding: 8px 12px; border-radius: 8px; margin: 8px 0; font-weight: bold; }

  select, input[type="text"], textarea { font: inherit; font-size: 0.95em; background: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 8px; }
  textarea { width: 100%; resize: vertical; min-height: 80px; }
  input[type="text"] { width: 100%; }

  /* 備課：教學流程 */
  .flow-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .flow-card .flow-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: bold; margin-bottom: 4px; }
  .flow-card dl { margin: 0; display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 4px 8px; font-size: 0.9em; line-height: 1.5; }
  .flow-card dt { color: var(--muted-color); font-weight: bold; }
  .flow-card dd { margin: 0; }
  .edit-step { border: 1px dashed var(--border-color); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; display: grid; gap: 6px; }
  .edit-blank { display: grid; gap: 6px; padding: 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.03); }
  :root[data-theme="blackboard"] .edit-blank { background: rgba(255, 255, 255, 0.04); }

  /* 投影：提問卡與紀錄表 */
  #app.projecting .side { display: flex; flex-direction: column; }
  .board-nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 0.75em; margin-bottom: 18px; }
  .board-text { font-size: 1.3em; line-height: 2.1; font-weight: bold; }
  .bw { white-space: nowrap; }
  #app.projecting { grid-template-columns: 260px minmax(0, 1fr) 560px; }
  .board-line { margin-bottom: 0.5em; }
  .opts { display: inline-flex; align-items: center; gap: 0.2em; margin: 0 0.3em; padding: 0 0.35em; border: 2px dashed var(--muted-color); border-radius: 14px; white-space: nowrap; }
  .opt { display: inline-block; padding: 0 0.3em; border: 3px solid transparent; border-radius: 999px; }
  .opt-sep { color: var(--muted-color); font-weight: normal; }
  .opt-correct { border-color: var(--x-color); }
  .board-log { margin-top: 14px; font-size: 0.8em; }
  .write-area { flex: 1; min-height: 260px; }
  .q-card { border: 3px solid var(--accent-color); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .q-card .q-title { font-size: 1.1em; font-weight: bold; margin-bottom: 8px; }
  .q-card .q-text { font-size: 1.15em; line-height: 1.6; }
  .q-answer { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--ok-bg); color: var(--ok-text); font-weight: bold; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--border-color); padding: 6px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }

  /* 學生作答 */
  .progress-track { height: 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.08); overflow: hidden; margin: 6px 0 14px; }
  :root[data-theme="blackboard"] .progress-track { background: rgba(255, 255, 255, 0.1); }
  .progress-fill { height: 100%; background: var(--accent-color); }
  .ws-step { border-left: 5px solid var(--accent-color); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; background: rgba(52, 152, 219, 0.06); line-height: 1.7; }
  .ws-step .ws-title { font-weight: bold; }

  /* 備課模式：右側放教案，加寬 */
  #app.prepping { grid-template-columns: 260px minmax(0, 1fr) minmax(0, 620px); }
  .plan-wrap { font-size: 0.9em; line-height: 1.6; }
  .plan-table td, .plan-table th { text-align: left; }
  .plan-table td[contenteditable], .plan-table [contenteditable] { outline: 1px dashed transparent; border-radius: 3px; }
  .plan-table [contenteditable]:hover { outline-color: var(--accent-color); }
  .plan-table [contenteditable]:focus { outline: 2px solid var(--accent-color); background: rgba(52, 152, 219, 0.06); }
  .paper { border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; font-size: 0.9em; line-height: 1.7; }
  summary { cursor: pointer; padding: 6px 0; }

  /* 投影模式：放大字級，方便學生上台操作與全班閱讀 */
  #app.projecting { font-size: 21px; }
  #app.projecting input[type="range"] { height: 28px; }

  .math-display { background: rgba(0, 0, 0, 0.03); padding: 10px 12px; border-radius: 8px; font-size: 0.88em; line-height: 1.8; font-variant-numeric: tabular-nums; }
  :root[data-theme="blackboard"] .math-display { background: rgba(255, 255, 255, 0.05); }
  .val-num { font-family: ui-monospace, monospace; font-weight: bold; }

  /* 投影：發給學生 */
  .share-card { border: 3px solid var(--accent-color); border-radius: 12px; padding: 14px; margin-top: 12px; display: grid; gap: 10px; font-size: 0.8em; }
  .qr-box { background: #fff; padding: 10px; border-radius: 8px; justify-self: start; }
  .qr-box img { display: block; width: 260px; max-width: 100%; height: auto; image-rendering: pixelated; }
  .share-url { font-family: ui-monospace, monospace; overflow-wrap: anywhere; user-select: all; margin: 0; }
  .back-link { text-decoration: none; display: inline-block; }

  @media (max-width: 1100px) {
    #app, #app.prepping, #app.projecting { grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: auto auto auto; height: auto; }
    .side { grid-column: 1 / -1; }
  }
  @media (max-width: 700px) {
    #app { display: flex; flex-direction: column; padding: 10px 16px; }
    .canvas-container { min-height: 380px; }
  }
  @media (prefers-reduced-motion: reduce) { .tab, .btn { transition: none; } }
</style>

<div id="app" class="prepping">
  <header class="topbar">
    <div class="row">
      <a class="tab back-link" id="backNav" href="../index.html">回導覽</a>
      <h1>口袋裡的物理實驗室．簡諧運動投影與匹配</h1>
    </div>
    <div class="tabs" role="group" aria-label="使用模式">
      <button class="tab" type="button" id="tabPrep" data-mode="prep" aria-pressed="true">備課</button>
      <button class="tab" type="button" id="tabProject" data-mode="project" aria-pressed="false">投影上課</button>
      <button class="tab" type="button" id="tabStudent" data-mode="student" aria-pressed="false">學生作答</button>
      <button class="tab" type="button" id="themeToggle" aria-pressed="false">切換黑板</button>
      <span class="badge" id="classBadge" hidden></span>
    </div>
  </header>

  <aside class="panel controls" aria-label="實驗控制板">
    <h2>實驗控制板</h2>
    <div class="row" style="margin-bottom: 12px;">
      <button class="btn" type="button" id="playPauseBtn" style="flex: 1;">暫停</button>
      <button class="btn btn-outline" type="button" id="resetBtn" style="flex: 1;">重置時間</button>
    </div>

    <div class="control-group">
      <label for="timeSlider">時間拖曳軸（t = <span id="tDisplay">0.00</span> T）</label>
      <div class="slider-row"><input type="range" id="timeSlider" min="0" max="1" step="0.005" value="0"></div>
    </div>

    <div class="control-group" style="border-left: 4px solid var(--shadow-color);">
      <label>【頂部投影源】</label>
      <label for="wSlider">圓周角速度 ω = <span id="wDisplay">2.0</span> rad/s</label>
      <div class="slider-row"><input type="range" id="wSlider" min="1.0" max="5.0" step="0.5" value="2.0"></div>
      <label for="rSlider" style="margin-top: 6px;">圓周半徑 R = <span id="rDisplay">1.0</span> m</label>
      <div class="slider-row"><input type="range" id="rSlider" min="0.5" max="2.0" step="0.1" value="1.0"></div>
    </div>

    <div class="control-group" style="border-left: 4px solid var(--accent-color);">
      <label>【底部彈簧系統】</label>
      <label for="kSlider">彈簧常數 k = <span id="kDisplay">4.0</span> N/m</label>
      <div class="slider-row"><input type="range" id="kSlider" min="1" max="50" step="1" value="4"></div>
      <label for="mSlider" style="margin-top: 6px;">質量 m = <span id="mDisplay">1.0</span> kg</label>
      <div class="slider-row"><input type="range" id="mSlider" min="1" max="10" step="1" value="1"></div>
    </div>

    <div class="control-group">
      <label>顯示彈簧球向量</label>
      <div class="checkbox-group">
        <label style="color: var(--x-color);"><input type="checkbox" id="showX" checked> 位置 x</label>
        <label style="color: var(--v-color);"><input type="checkbox" id="showV" checked> 速度 v</label>
        <label style="color: var(--a-color);"><input type="checkbox" id="showA" checked> 加速度 a</label>
      </div>
    </div>

    <div id="matchStatus" class="match-status match-fail">尚未同步（ω ≠ √(k/m)）</div>

    <div class="math-display">
      x影 = R cos(ωt) = <span class="val-num" id="val_xc">1.00</span> m<br>
      x彈 = R cos(ω₀t) = <span class="val-num" id="val_xs">1.00</span> m<br>
      v = −Rω₀ sin(ω₀t) = <span class="val-num" id="val_vs">0.00</span> m/s<br>
      a = −Rω₀² cos(ω₀t) = <span class="val-num" id="val_as">-4.00</span> m/s²
    </div>
  </aside>

  <main class="stage">
    <div class="canvas-container" id="p5container">
      <div class="canvas-state" id="canvasState">動畫載入中…</div>
      <div id="thetaLabel" hidden>θ</div>
    </div>
  </main>

  <section class="panel side" id="side" aria-live="polite"></section>
</div>

<script>
// 預設題目：沿用原作品的學習單，老師可在「備課」修改；ref 是參考回答
const defaultSteps = [
  { id: 's1', kind: 'text', title: 'STEP 1 觀察', prompt: '先觀察上方圓周運動產生的「灰色影子」，以及下方「綠色彈簧球」的運動。它們現在的快慢一樣嗎？', ref: '影子左右來回振盪；兩者快慢不同。', board: '灰色影子的速度 {＞|＝|＜} 綠色彈簧球的速度' },
  { id: 's2', kind: 'cloze', title: 'STEP 2 預測', prompt: '先預測，再動手驗證。', blanks: [
    { text: '如果把彈簧球的質量 m 變為原本的 4 倍，振盪會', options: ['變快', '變慢', '不變'], answer: '變慢' }
  ], board: 'm 變 4 倍，振盪 {變快|變慢*|不變}' },
  { id: 's3', kind: 'task', title: 'STEP 3 動手對齊', prompt: '調整左側的彈簧常數 k 與質量 m，讓彈簧球與灰色影子完全重合。成功一次後，換一組 k、m 再對齊一次。', need: 2, ref: '成功對齊時，k/m 都等於 ω²。', board: '讓彈簧球對齊影子', showLog: true },
  { id: 's4', kind: 'cloze', title: 'STEP 4 觀察向量', prompt: '在同步狀態下按暫停，拖曳時間軸觀察彈簧球的向量。', blanks: [
    { text: '位移 x 在端點最大時，速度 v 為', options: ['0（靜止）', '最大值'], answer: '0（靜止）' },
    { text: '加速度 a 的方向永遠', options: ['指向平衡點', '遠離平衡點'], answer: '指向平衡點' }
  ], board: '端點的速度 v {＝ 0*|最大}\n加速度 a 的方向 {指向*|遠離} 平衡點' },
  { id: 's5', kind: 'cloze', title: 'STEP 5 發現規律', prompt: '比較你成功對齊時的 k、m 與 ω。', blanks: [
    { text: '投影源的角速度 ω 等於彈簧系統的', options: ['k / m', '√(k / m)', 'm / k'], answer: '√(k / m)' }
  ], board: 'ω ＝ {k/m|√(k/m)*|m/k}', showLog: true },
  { id: 's6', kind: 'text', title: '綜合心得', prompt: '寫下你在對齊過程中觀察到的現象，或對公式的理解。', ref: '等速圓周運動的投影就是簡諧運動；ω = √(k/m)，所以 T = 2π√(m/k)，質量越大振盪越慢。', board: '我的發現：' }
]

// 預設教案：依使用者提供的教案格式（基本資料、學習目標、教學活動設計、附錄一學習單）
const defaultPlan = {
  unit: '簡諧運動：等速圓周運動的投影與彈簧振子',
  designer: '',
  target: '高中二年級（選修物理）',
  time: '50分鐘',
  equipment: '黑板、粉筆、筆電、投影機、本模擬（有平板時可讓學生自行操作）',
  objTitle: '簡諧運動',
  cognitive: '學生能說出等速圓周運動的投影是簡諧運動，並由 ω = √(k/m) 推得 T = 2π√(m/k)',
  affective: '學生能和他人分享自己的預測與觀察',
  skill: '學生能操作模擬、記錄數據並歸納出規律',
  phases: [
    { name: '準備活動', min: 5, items: [
      { text: '教師以「投影上課」模式播放動畫，問：「影子在做什麼運動？和下面的彈簧球一樣快嗎？」（學習單 STEP 1）', min: 2, note: '教師須準備學習單（附錄一）' },
      { text: '請學生預測：質量 m 變為 4 倍，振盪變快還是變慢？舉手表決並把票數寫在黑板（學習單 STEP 2）', min: 3, note: '常見迷思：以為質量不影響週期，和單擺混淆' }

// 物理狀態（沿用原作品）
const state = { isPlaying: true, phase: 0, t: 0, R: 1.0, w: 2.0, k: 4.0, m: 1.0, w0: 2.0, xc: 1.0, xs: 1.0, vs: 0, as: -4.0 }
let scaleFactor = 100
let isBlackboard = false
let wasMatched = false
let shouldSpawnConfetti = false
const confettis = []

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

// 隨機起始參數，避免一開始就同步
const randomizeInitialState = () => {
  const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a
  const randStep = (a, b, s) => a + Math.floor(Math.random() * (Math.floor((b - a) / s) + 1)) * s
  do {
    state.w = randStep(1.0, 5.0, 0.5)
    state.k = randInt(1, 50)
    state.m = randInt(1, 10)
  } while (Math.abs(state.w - Math.sqrt(state.k / state.m)) < 0.01)
  $('wSlider').value = state.w
  $('kSlider').value = state.k
  $('mSlider').value = state.m
}

// 讀取滑桿並更新數值
const updateParams = () => {
  state.R = parseFloat($('rSlider').value)
  state.w = parseFloat($('wSlider').value)
  state.k = parseFloat($('kSlider').value)
  state.m = parseFloat($('mSlider').value)
  state.w0 = Math.sqrt(state.k / state.m)
  $('rDisplay').textContent = state.R.toFixed(1)
  $('wDisplay').textContent = state.w.toFixed(1)
  $('kDisplay').textContent = state.k.toFixed(1)
  $('mDisplay').textContent = state.m.toFixed(1)
  updatePhysics()
}

// 對齊成功時記錄一筆，同一組 k、m 不重複記
const logMatch = () => {
  const last = ui.matchLog[ui.matchLog.length - 1]
  if (last && last.k === state.k && last.m === state.m && last.w === state.w) return
  ui.matchLog.push({ k: state.k, m: state.m, w: state.w })
  store.set(KC('matchLog'), ui.matchLog)
  if (ui.mode !== 'prep') renderSide()
}

// 計算位置、速度、加速度與同步判定
const updatePhysics = () => {
  const Tc = (2 * Math.PI) / state.w
  state.t = state.phase * Tc
  state.xc = state.R * Math.cos(state.w * state.t)
  state.xs = state.R * Math.cos(state.w0 * state.t)
  state.vs = -state.R * state.w0 * Math.sin(state.w0 * state.t)
  state.as = -state.R * state.w0 * state.w0 * Math.cos(state.w0 * state.t)
  $('tDisplay').textContent = state.phase.toFixed(2)
  $('val_xc').textContent = state.xc.toFixed(2)
  $('val_xs').textContent = state.xs.toFixed(2)
  $('val_vs').textContent = state.vs.toFixed(2)
  $('val_as').textContent = state.as.toFixed(2)

  const isMatch = Math.abs(state.w - state.w0) < 0.01
  const box = $('matchStatus')
  const html = isMatch
    ? `完美同步<br><span style="font-weight: normal;">|F| = kR = ${(state.k * state.R).toFixed(1)} N，mRω² = ${(state.m * state.R * state.w * state.w).toFixed(1)} N</span>`
    : '尚未同步（ω ≠ √(k/m)）'
  if (box.dataset.raw !== html) {
    box.className = isMatch ? 'match-status match-success' : 'match-status match-fail'
    box.innerHTML = html
    box.dataset.raw = html
  }
  if (isMatch && !wasMatched) {
    shouldSpawnConfetti = true
    logMatch()
  }
  wasMatched = isMatch
}

      const code = qrcode(0, 'M')
      code.addData(link)
      code.make()
      qr = `<div class="qr-box"><img src="${code.createDataURL(6, 2)}" alt="學生網址的 QR code"></div>`
    } catch (e) {
      qr = '<div class="msg-error">網址太長，無法產生 QR code，請少改幾題。網址仍可複製。</div>'
    }
  }
  const note = k
    ? `網址長度 ${link.length} 字元。你改過的 ${k} 題已放進網址，其餘用預設題。學生不用登入。`
    : '沒有改過題目，學生看到的是預設題。'
  return `<div class="share-card">
    <div class="row" style="justify-content: space-between;"><strong>請學生用手機掃描</strong><span class="badge">${esc(Site.classLabel(cls))}</span></div>
    ${qr}
    <p class="share-url" id="shareUrl">${esc(link)}</p>
    <p class="muted" style="margin: 0;">${note}${link.length > 2000 ? '網址很長，QR code 可能不好掃，建議少改幾題。' : ''}</p>
    <div class="row">
      <button class="btn" type="button" data-act="share-copy">複製網址</button>
      <button class="btn btn-outline" type="button" data-act="share-close">收起</button>
      <span class="muted" id="shareMsg"></span>
    </div>
  </div>`
}

// ---------- 右側面板：學生作答 ----------
const matchCount = () => new Set(ui.matchLog.map((r) => `${r.k}-${r.m}-${r.w}`)).size

//這一題目前的答案（用來和確定時的快照比對）
const stepAnswer = (s) => s.kind === 'text'
  ? JSON.stringify([(ui.answers[s.id] || '').trim()])
  : JSON.stringify(s.blanks.map((b, bi) => ui.answers[`${s.id}-${bi}`] || ''))
//每一格都有填才算有輸入
const stepFilled = (s) => s.kind === 'text'
  ? !!(ui.answers[s.id] || '').trim()
  : s.blanks.every((b, bi) => !!ui.answers[`${s.id}-${bi}`])
//有輸入、且和上次確定的內容不同，按鈕才亮
const canConfirm = (s) => stepFilled(s) && ui.confirmed[s.id] !== stepAnswer(s)

const confirmNote = (s) => !ui.confirmed[s.id] ? '' : (ui.confirmed[s.id] !== stepAnswer(s) ? '已修改，按確定更新' : '已記錄')

const isAnswered = (s) => {
  if (s.kind === 'task') return matchCount() >= (s.need || 1)
  return !!ui.confirmed[s.id]
}

//輸入時就地更新按鈕，不重繪，避免打字中斷
const updateConfirmBtn = (stepId) => {
  const st = ui.steps.find((x) => x.id === stepId)
  const btn = document.querySelector(`[data-confirm="${stepId}"]`)
  if (st && btn) btn.disabled = !canConfirm(st)
  const note = document.querySelector(`[data-note="${stepId}"]`)
  if (st && note) note.textContent = confirmNote(st)
}

const renderStudent = () => {
  if (ui.submitted) return renderSummary()
  const done = ui.steps.filter(isAnswered).length
  const pct = Math.round(done / ui.steps.length * 100)
  const steps = ui.steps.map((s) => {
    let field = ''
    if (s.kind === 'text') {
      field = `<textarea data-ans="${s.id}" aria-label="${esc(s.title)}">${esc(ui.answers[s.id] || '')}</textarea>`
    } else if (s.kind === 'cloze') {
      field = s.blanks.map((b, bi) => `<div>${esc(b.text)}
        <select data-ans="${s.id}-${bi}" aria-label="${esc(b.text)}">
          <option value="">請選擇</option>
          ${b.options.map((o) => `<option ${ui.answers[`${s.id}-${bi}`] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
        </select>。</div>`).join('')
    } else {
      const n = matchCount()
      field = n >= (s.need || 1)
        ? `<span class="badge badge-ok">已完成：成功對齊 ${n} 組</span>`
        : `<span class="badge">進行中：已對齊 ${n} / ${s.need || 1} 組</span>`
    }
    const confirmRow = s.kind === 'task' ? '' : `<div class="confirm-row">
      <span class="muted" data-note="${s.id}">${confirmNote(s)}</span>
      <button class="btn btn-confirm" type="button" data-act="confirm" data-confirm="${s.id}" ${canConfirm(s) ? '' : 'disabled'}>確定</button>
    </div>`
    return `<div class="ws-step"><div class="ws-title">${esc(s.title)}</div><div>${esc(s.prompt)}</div>${field}${confirmRow}</div>`
  }).join('')

  $('side').innerHTML = `
    <h2>探究學習單</h2>
    ${fromUrl && shared.loaded ? `<div><span class="badge badge-ok">已載入老師更新的 ${shared.loaded} 題</span></div>` : ''}
    ${fromUrl && shared.error ? '<div><span class="badge badge-bad">題目沒有載入</span></div><div class="msg-error">這個網址的題目資料不完整，先用預設題目作答。請向老師要新的網址。</div>' : ''}
    <label for="studentName"><strong>座號與姓名</strong></label>
    <input type="text" id="studentName" placeholder="例如：12 王小明" value="${esc(ui.student)}">
    <div class="row" style="justify-content: space-between; margin-top: 12px;"><span class="muted">完成進度</span><strong>${done} / ${ui.steps.length}</strong></div>
    <div class="progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="完成進度"><div class="progress-fill" style="width: ${pct}%;"></div></div>
    ${steps}
    ${ui.submitError ? `<div class="msg-error">${esc(ui.submitError)}</div>` : ''}
    <button class="btn btn-block" type="button" data-act="submit">交出學習單</button>
    <p class="muted">作答會暫存在這台裝置上，重新整理不會消失。</p>`
}

const summaryText = () => {
  const lines = [`簡諧運動學習單｜${Site.classLabel(cls)}｜${ui.student}`]
  ui.steps.forEach((s) => {

// 複製文字：剪貼簿失敗時改為選取文字
const copyText = (text, fallbackEl) => {
  const msg = $('copyMsg')
  const done = (ok) => { if (msg) msg.textContent = ok ? '已複製' : '無法自動複製，已選取文字，請按 Ctrl＋C' }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true)).catch(() => { if (fallbackEl) fallbackEl.select(); done(false) })
  } else { if (fallbackEl) fallbackEl.select(); done(false) }
}

// 複製帶格式的教案，貼到 Word 會保留表格；不支援時改複製純文字
const copyRich = (html, text) => {
  const msg = $('copyMsg')
  const say = (t) => { if (msg) msg.textContent = t }
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      const item = new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })
      navigator.clipboard.write([item]).then(() => say('已複製，可直接貼到 Word')).catch(() => copyText(text))
      return
    }
  } catch (e) { /* 改用純文字 */ }
  copyText(text)
}

// 依路徑寫回教案欄位，例如 phases.0.items.1.min
const setPlanPath = (path, value) => {
  const keys = path.split('.')
  let obj = ui.plan
  keys.slice(0, -1).forEach((k) => { obj = obj[k] })
  const last = keys[keys.length - 1]
  obj[last] = last === 'min' ? (parseInt(value, 10) || 0) : value
  store.set('shm.plan', ui.plan)
}

// 從編輯欄位讀回題目
const readEditors = () => {
  const steps = JSON.parse(JSON.stringify(ui.steps))
  document.querySelectorAll('[data-edit]').forEach((el) => {
    const s = steps[+el.dataset.s]
    const b = el.dataset.b !== undefined ? s.blanks[+el.dataset.b] : null
    if (el.dataset.edit === 'title') s.title = el.value.trim() || s.title
    if (el.dataset.edit === 'prompt') s.prompt = el.value.trim()
    if (el.dataset.edit === 'ref') s.ref = el.value.trim()
    if (el.dataset.edit === 'board') s.board = el.value.split('\n').map((l) => l.trim()).filter(Boolean).join('\n')
    if (el.dataset.edit === 'blank-text') b.text = el.value.trim()
    if (el.dataset.edit === 'blank-options') b.options = el.value.split(/[、,，]/).map((x) => x.trim()).filter(Boolean)
    if (el.dataset.edit === 'blank-answer') b.answer = el.value
  })
  // 正確答案若不在新選項中，改為第一個選項
  steps.forEach((s) => (s.blanks || []).forEach((b) => { if (!b.options.includes(b.answer)) b.answer = b.options[0] || '' }))
  return steps
}

    ui.confirmed[st.id] = stepAnswer(st)

  }
  if (act === 'back-edit') { ui.submitted = false; renderSide() }
})

// ---------- 彩紙（沿用原作品） ----------
class Confetti {
  constructor (p, x, y) {
    this.p = p; this.x = x; this.y = y
    this.vx = p.random(-5, 5); this.vy = p.random(-12, -4)
    this.size = p.random(6, 12)
    p.push(); p.colorMode(p.HSL); this.color = p.color(p.random(360), 85, 60); p.pop()
    this.alpha = 255; this.fadeSpeed = p.random(4, 8)
    this.rotation = p.random(p.TWO_PI); this.rotationSpeed = p.random(-0.1, 0.1)
  }
  update () { this.x += this.vx; this.y += this.vy; this.vy += 0.3; this.alpha -= this.fadeSpeed; this.rotation += this.rotationSpeed }
  draw () {
    const p = this.p
    p.push(); p.translate(this.x, this.y); p.rotate(this.rotation)
    p.fill(p.red(this.color), p.green(this.color), p.blue(this.color), this.alpha)
    p.noStroke(); p.rectMode(p.CENTER); p.rect(0, 0, this.size, this.size); p.pop()
  }
  isDead () { return this.alpha <= 0 }
}

// ---------- 繪圖（沿用原作品） ----------
const drawArrow = (p, col, x, y, vecX, vecY, label, labelYOffset = -18) => {
  p.push(); p.translate(x, y); p.stroke(col); p.strokeWeight(4); p.fill(col)
  p.line(0, 0, vecX, vecY)
  const angle = p.atan2(vecY, vecX)
  p.translate(vecX, vecY); p.rotate(angle); p.triangle(0, 0, -10, 7, -10, -7)
  p.noStroke(); p.rotate(-angle); p.textSize(18); p.textStyle(p.BOLD); p.textAlign(p.CENTER, p.CENTER)
  p.text(label, vecX > 0 ? 18 : -18, labelYOffset)
  p.pop()
}

const drawCanvasInternal = (p) => {
  const bg = isBlackboard ? p.color(26, 42, 34) : p.color(248, 249, 250)
  const strokeCol = isBlackboard ? p.color(255) : p.color(50)
  const guideCol = isBlackboard ? p.color(255, 255, 255, 60) : p.color(0, 0, 0, 40)
  const cX = p.color(46, 204, 113)
  const cV = p.color(231, 76, 60)
  const cA = p.color(155, 89, 182)
  const shadowCol = isBlackboard ? p.color(200, 200, 200, 150) : p.color(149, 165, 166, 150)
  p.background(bg)

  const cx = p.width / 2
  const cyTop = p.height * 0.35
  const cyBot = p.height * 0.85
  scaleFactor = Math.min(p.width / 3.0, p.height / 5.5)
  const pixR = state.R * scaleFactor
  const cyShadow = cyTop + pixR + 25

  // 平行光源
  p.push(); p.translate(cx, 0); p.fill(241, 196, 15, isBlackboard ? 40 : 30); p.noStroke(); p.rectMode(p.CENTER)
  p.rect(0, cyShadow / 2, pixR * 2 + 60, cyShadow)
  for (let rx = -pixR - 20; rx <= pixR + 20; rx += 25) {
    p.stroke(241, 196, 15, isBlackboard ? 80 : 60); p.strokeWeight(1); p.line(rx, 10, rx, cyShadow)
    p.noStroke(); p.fill(241, 196, 15, 200); p.ellipse(rx, 10, 14, 14)
    p.fill(isBlackboard ? 100 : 150); p.rect(rx, 2, 8, 8, 2)
  }
  p.pop()

  // 圓周運動
  p.push(); p.translate(cx, cyTop); p.stroke(guideCol); p.strokeWeight(1.5)
  p.line(-pixR - 40, 0, pixR + 40, 0); p.line(0, -pixR - 40, 0, pixR + 40)
  p.noFill(); p.ellipse(0, 0, pixR * 2, pixR * 2)
  const normTheta = (state.w * state.t) % p.TWO_PI
  const pX = pixR * p.cos(normTheta)
  const pY = -pixR * p.sin(normTheta)
  const arcRadius = Math.max(25, Math.min(50, scaleFactor * 0.4))
  p.fill(isBlackboard ? p.color(255, 255, 255, 30) : p.color(0, 0, 0, 20)); p.stroke(strokeCol); p.strokeWeight(1.5)
  if (normTheta > 0.01) p.arc(0, 0, arcRadius * 2, arcRadius * 2, -normTheta, 0, p.PIE)
  p.strokeWeight(2.5); p.line(0, 0, pX, pY); p.fill(strokeCol); p.noStroke(); p.ellipse(pX, pY, 18, 18)
  p.pop()

  const thetaDOM = $('thetaLabel')
  thetaDOM.hidden = false
  thetaDOM.style.left = (cx + arcRadius * 0.5 * Math.cos(-Math.PI / 8)) + 'px'
  thetaDOM.style.top = (cyTop + arcRadius * 0.5 * Math.sin(-Math.PI / 8)) + 'px'

  // 影子
  const pixXc = state.xc * scaleFactor
  p.push(); p.translate(cx, cyShadow); p.stroke(guideCol); p.strokeWeight(1.5)
  p.drawingContext.setLineDash([6, 6]); p.line(-pixR - 50, 0, pixR + 50, 0); p.drawingContext.setLineDash([])
  p.stroke(shadowCol); p.strokeWeight(2.5); p.drawingContext.setLineDash([5, 5])
  p.line(pixXc, cyTop - cyShadow + pY, pixXc, 0); p.drawingContext.setLineDash([])
  p.fill(shadowCol); p.noStroke(); p.ellipse(pixXc, 0, 46, 20)
  p.fill(strokeCol); p.textAlign(p.CENTER, p.BOTTOM); p.textSize(14); p.textStyle(p.BOLD); p.text('影子', pixXc, -12)
  p.pop()

  // 彈簧振子
  const pixXs = state.xs * scaleFactor
  const maxTrack = 2.0 * scaleFactor + 50
  const boxSize = 36 + (state.m - 1) * 3
  p.push(); p.translate(cx, cyBot); p.stroke(guideCol); p.strokeWeight(4); p.line(-maxTrack, 25, maxTrack, 25)
  p.drawingContext.setLineDash([6, 6]); p.line(0, 25, 0, cyShadow - cyBot + 25); p.drawingContext.setLineDash([])
  p.fill(guideCol); p.noStroke(); p.rect(-maxTrack - 15, -35, 30, 70)
  p.noFill(); p.stroke(strokeCol); p.strokeWeight(3.5); p.beginShape(); p.vertex(-maxTrack, 0)
  const springEnd = pixXs - boxSize / 2
  const step = (springEnd + maxTrack) / 16
  for (let i = 1; i < 16; i++) p.vertex(-maxTrack + i * step, (i % 2 === 0) ? 14 : -14)
  p.vertex(springEnd, 0); p.endShape()
  p.fill(isBlackboard ? p.color(50, 150, 100) : p.color(200, 230, 210)); p.stroke(strokeCol); p.rectMode(p.CENTER)
  p.rect(pixXs, 0, boxSize, boxSize, 8)
  p.fill(strokeCol); p.noStroke(); p.textAlign(p.CENTER, p.CENTER); p.textSize(16); p.textStyle(p.BOLD); p.text(state.m + 'kg', pixXs, 0)
  p.pop()

  // 向量
  p.push(); p.translate(cx + state.xs * scaleFactor, cyBot)
  if ($('showV').checked && Math.abs(state.vs) > 0.05) drawArrow(p, cV, 0, -boxSize / 2 - 8, state.vs * scaleFactor * 0.2, 0, 'v')
  if ($('showA').checked && Math.abs(state.as) > 0.05) drawArrow(p, cA, 0, -boxSize / 2 - 32, state.as * scaleFactor * 0.05, 0, 'a')
  p.pop()
  if ($('showX').checked && Math.abs(state.xs) > 0.05) { p.push(); p.translate(cx, cyBot + 45); drawArrow(p, cX, 0, 0, state.xs * scaleFactor, 0, 'x', 22); p.pop() }

  // 彩紙
  if (shouldSpawnConfetti) {
    for (let i = 0; i < 80; i++) confettis.push(new Confetti(p, cx + state.xs * scaleFactor, cyBot))
    shouldSpawnConfetti = false
  }
  for (let i = confettis.length - 1; i >= 0; i--) {
    confettis[i].update(); confettis[i].draw()
    if (confettis[i].isDead()) confettis.splice(i, 1)
  }
}

// ---------- 啟動 ----------
randomizeInitialState()
updateParams()
// 學生用網址開啟時，不顯示回導覽
$('backNav').hidden = startMode === 'student'
setMode(startMode)

if (typeof window.p5 === 'undefined') {
  $('canvasState').textContent = '動畫載入失敗，請檢查網路連線後重新整理。學習單與紀錄表仍可使用。'
} else {
  new window.p5((p) => {
    let parentDiv
    p.setup = () => {
      parentDiv = $('p5container')
      const canvas = p.createCanvas(parentDiv.clientWidth, parentDiv.clientHeight)
      canvas.parent('p5container')
      $('canvasState').hidden = true
      updateParams()
    }
    p.windowResized = () => {
      if (parentDiv.clientWidth > 0 && parentDiv.clientHeight > 0) p.resizeCanvas(parentDiv.clientWidth, parentDiv.clientHeight)
    }
    p.draw = () => {
      if (state.isPlaying) {
        state.phase += (1 / 60) / ((2 * Math.PI) / state.w)
        if (state.phase > 1) state.phase -= 1
        $('timeSlider').value = state.phase
        updatePhysics()
      }
      drawCanvasInternal(p)
    }
    window.drawCanvas = () => drawCanvasInternal(p)
  })
}
</script>
