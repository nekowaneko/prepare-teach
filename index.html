<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>口袋裡的物理實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/components.css">
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  h1, h2, p { margin: 0; }
  /* 和凍結原型相同：排版用的列不要元件預設的內距 */
  .sl-row { padding: 0; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-block: var(--space-4) var(--space-8); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: var(--space-4); }
  .muted { color: var(--ink-muted); }
  .stack { display: grid; gap: var(--space-2); min-width: 0; }
  .spread { display: flex; gap: var(--space-3); align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .field-label { color: var(--ink-muted); min-width: 6em; }
  .url { font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 18px; overflow-wrap: anywhere; color: var(--ink-muted); }
  .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--space-2); }
  .card-btn { font: inherit; color: inherit; text-align: left; width: 100%; border: 1px solid transparent; cursor: pointer; display: grid; gap: var(--space-1); align-content: start; }
  .card-btn:hover { border-color: var(--line); }
  .card-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .card-title { font-weight: 500; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script src="data/units.js"></script>
<script src="site.js"></script>
<script>
// 導覽頁：選好今天的模式與班級，再點單元進入。單元清單來自 data/units.js
(() => {
  const $ = (id) => document.getElementById(id)
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  // 卡片只放三種模式都做好的單元；只有教案、外部整理頁不放
  const units = (window.UNITS || []).filter((u) => u.status === 'ready')
  const S = Site.prefs()

  const modeBtns = () => Object.entries(Site.MODES).map(([k, v]) =>
    `<button class="sl-btn${S.mode === k ? ' sl-btn-slate' : ''}" type="button" data-act="mode" data-v="${k}" aria-pressed="${S.mode === k}">${v}</button>`).join('')
  const classBtns = () => Site.CLASSES.map((c) =>
    `<button class="sl-btn${S.cls === c.code ? ' sl-btn-slate' : ''}" type="button" data-act="cls" data-v="${c.code}" aria-pressed="${S.cls === c.code}">${Site.classLabel(c.code)}</button>`).join('')

  const unitCard = (u) => {
    const badge = '<span class="sl-badge sl-badge-success">三種模式都有</span>'
    const hint = `開啟${Site.MODES[S.mode]}`
    return `<button class="sl-card card-btn" type="button" data-act="unit" data-v="${esc(u.id)}">
      <span class="card-title">${esc(u.title)}</span>
      <span class="sl-card-label">${esc(u.meta)}</span>
      <span class="spread">${badge}<span class="sl-text-caption muted">${hint}</span></span>
    </button>`
  }

  // 「繼續上次」：有紀錄時用石板深色卡片，點了直接進入
  const lastCard = () => {
    const l = Site.last()
    const u = l && units.find((x) => x.id === l.id)
    if (!u) return '<div class="sl-card stack"><span class="sl-card-label">繼續上次</span><span class="muted">還沒有開過單元。選好模式後點下方的單元卡片。</span></div>'
    return `<button class="sl-card sl-card-slate card-btn" type="button" data-act="resume">
      <span class="sl-card-label">繼續上次</span>
      <span class="sl-card-value">${esc(u.title)}</span>
      <span class="sl-card-label">${Site.MODES[l.mode]}${l.mode === 'prep' ? '' : `．${Site.classLabel(l.cls)}`}</span>
    </button>`
  }

  // 沒有做好單元的分組不顯示；一個都沒有時才提示去課綱對照
  const groupsHtml = () => {
    const html = (window.UNIT_GROUPS || []).map((g) => {
      const list = units.filter((u) => u.group === g)
      return list.length ? `<section class="stack" aria-label="${esc(g)}">
        <h2 class="sl-text-label muted">${esc(g)}</h2>
        <div class="unit-grid">${list.map(unitCard).join('')}</div>
      </section>` : ''
    }).join('')
    return html || '<div class="sl-card stack"><span>還沒有自己的單元。</span><span class="muted">可以先到右上角的課綱對照找現成的外部模擬。</span></div>'
  }

  // 網址預覽：以第一個三種模式都有的單元為例
  const previewUrl = () => { const u = units.find((x) => x.status === 'ready'); return u ? Site.unitUrl(u, S.mode, S.cls) : '' }

  function render () {
    $('app').innerHTML = `
      <header class="spread">
        <h1 class="sl-text-title">口袋裡的物理實驗室</h1>
        <div class="sl-row" role="group" aria-label="頁面">
          <button class="sl-btn sl-btn-slate" type="button" aria-pressed="true">單元</button>
          <button class="sl-btn" type="button" data-act="go" data-v="curriculum.html" aria-pressed="false">課綱：理化、物理</button>
          <button class="sl-btn" type="button" data-act="go" data-v="EarthScience/index.html" aria-pressed="false">課綱：地科</button>
        </div>
      </header>
      <section class="sl-card stack" aria-label="今天要做什麼">
        <div class="sl-row"><span class="sl-text-label field-label">今天要做什麼</span><div class="sl-row" role="group" aria-label="模式">${modeBtns()}</div></div>
        ${S.mode === 'prep' ? '' : `<div class="sl-row"><span class="sl-text-label field-label">班級</span><div class="sl-row" role="group" aria-label="班級">${classBtns()}</div></div>`}
        <p class="url">點單元會開啟：${esc(previewUrl())}</p>
      </section>
      <div class="unit-grid">${lastCard()}</div>
      ${groupsHtml()}`
  }

  $('app').addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]')
    if (!t) return
    const act = t.dataset.act
    if (act === 'mode') { S.mode = t.dataset.v; Site.setPrefs(S.mode, S.cls); render() }
    if (act === 'cls') { S.cls = t.dataset.v; Site.setPrefs(S.mode, S.cls); render() }
    if (act === 'go') window.location.href = t.dataset.v
    if (act === 'resume') { const l = Site.last(); const u = l && units.find((x) => x.id === l.id); if (u) Site.openUnit(u, l.mode, l.cls) }
    if (act === 'unit') {
      const u = units.find((x) => x.id === t.dataset.v)
      if (u) Site.openUnit(u, S.mode, S.cls)
    }
  })

  render()
})()
</script>
</body>
</html>
